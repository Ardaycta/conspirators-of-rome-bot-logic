<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Conspirators of Rome</title>
<style>
:root{
  --ink:#26211b;
  --ink-dim:#5c5346;
  --ground:#f2ede1;
  --panel:#ffffff;
  --panel-2:#e9e1d0;
  --line:#d9cfb8;
  --gold:#a4791f;
  --gold-strong:#8a6316;
  --tyrian:#5b2333;
  --tyrian-strong:#421826;
  --republic:#3f6b4e;
  --republic-strong:#2e5039;
  --imperium:#8c2f26;
  --imperium-strong:#6f231b;
  --shadow: 0 10px 30px -12px rgba(38,33,27,0.35);
  --font-display:'Cinzel', Georgia, 'Times New Roman', serif;
  --font-body:'Crimson Pro', Georgia, serif;
  --font-mono:'JetBrains Mono', 'Courier New', monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#ece3d0;
    --ink-dim:#b9ac91;
    --ground:#1c1712;
    --panel:#26201a;
    --panel-2:#332a20;
    --line:#4a3f30;
    --gold:#d1a83f;
    --gold-strong:#e6c264;
    --tyrian:#c76a83;
    --tyrian-strong:#e08aa1;
    --republic:#6fae86;
    --republic-strong:#8fcaa4;
    --imperium:#e2685a;
    --imperium-strong:#f08d81;
    --shadow: 0 10px 34px -10px rgba(0,0,0,0.6);
  }
}
:root[data-theme="dark"]{
  --ink:#ece3d0;
  --ink-dim:#b9ac91;
  --ground:#1c1712;
  --panel:#26201a;
  --panel-2:#332a20;
  --line:#4a3f30;
  --gold:#d1a83f;
  --gold-strong:#e6c264;
  --tyrian:#c76a83;
  --tyrian-strong:#e08aa1;
  --republic:#6fae86;
  --republic-strong:#8fcaa4;
  --imperium:#e2685a;
  --imperium-strong:#f08d81;
  --shadow: 0 10px 34px -10px rgba(0,0,0,0.6);
}
*{box-sizing:border-box;}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100%;
}
#app{
  max-width:560px;
  margin:0 auto;
  padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));
  min-height:100%;
  display:flex;
  flex-direction:column;
  gap:16px;
}
h1,h2,h3{
  font-family:var(--font-display);
  letter-spacing:0.02em;
  margin:0;
  text-wrap:balance;
}
h1{font-size:1.5rem;}
h2{font-size:1.15rem;}
h3{font-size:.95rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-dim);}
p{margin:0; line-height:1.5;}
.eyebrow{
  font-family:var(--font-mono);
  font-size:.68rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold-strong);
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  gap:14px;
}
.stack{display:flex;flex-direction:column;gap:10px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;}
button{
  font-family:var(--font-body);
  font-size:1rem;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--ink);
  padding:14px 18px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform .08s ease, background .15s ease, border-color .15s ease;
}
button:active{transform:scale(0.97);}
button.primary{
  background:var(--tyrian);
  border-color:var(--tyrian-strong);
  color:#fff8ee;
  font-family:var(--font-display);
  letter-spacing:.03em;
}
button.gold{
  background:var(--gold);
  border-color:var(--gold-strong);
  color:#2a1e05;
  font-family:var(--font-display);
}
button.ghost{background:transparent;}
button.danger{background:var(--imperium);border-color:var(--imperium-strong);color:#fff3ef;}
button.full{width:100%;}
button:disabled{opacity:.4;cursor:not-allowed;}
input[type=text]{
  font-family:var(--font-body);
  font-size:1rem;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--ink);
  width:100%;
}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--font-mono);
  font-size:.72rem;
  padding:4px 10px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--ink-dim);
  white-space:nowrap;
}
.pill.on{background:var(--tyrian);border-color:var(--tyrian-strong);color:#fff8ee;}
.notices{gap:6px;}
.pill.notice{display:flex;align-items:center;gap:5px;border-color:var(--gold-strong);color:var(--gold-strong);}
.pill.notice svg{width:12px;height:12px;flex-shrink:0;}
.trackwrap{display:flex;flex-direction:column;gap:8px;}
.track{display:flex;gap:6px;flex-wrap:wrap;}
.trackcard{
  flex:1 1 40px;
  min-width:40px;
  max-width:58px;
  aspect-ratio:5/7;
  border-radius:7px;
  border:2px dashed var(--line);
  background:var(--panel-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:var(--font-mono);
  font-size:.62rem;
  color:var(--ink-dim);
  position:relative;
}
.trackcard.filled{border-style:solid;}
.trackcard.filled.rp{background:var(--republic);border-color:var(--republic-strong);color:#f4fff0;}
.trackcard.filled.im{background:var(--imperium);border-color:var(--imperium-strong);color:#fff3ef;}
.trackcard .ticon{width:16px;height:16px;flex-shrink:0;}
.trackcard .ticon svg{width:100%;height:100%;display:block;}
.trackcard .tlabel{
  font-family:var(--font-display);
  font-size:.52rem;
  letter-spacing:.02em;
  text-align:center;
  line-height:1.1;
}
.trackcard .tnote{
  font-family:var(--font-mono);
  font-size:.46rem;
  letter-spacing:.02em;
  opacity:.8;
  text-align:center;
  line-height:1;
  cursor:default;
}
.trackcard.power:not(.filled){border-color:var(--gold-strong);color:var(--gold-strong);}
.trackcard.win:not(.filled){border-color:var(--tyrian-strong);color:var(--tyrian);border-style:solid;}
.trackcard.danger{box-shadow:inset 0 -4px 0 0 #8b1a1a;}
.trackcard.danger:not(.filled){border-color:#8b1a1a;}
.trackcard .tdanger{
  font-family:var(--font-display);
  font-size:.46rem;
  letter-spacing:.03em;
  color:#8b1a1a;
  text-transform:uppercase;
  text-align:center;
  line-height:1;
}
.trackcard.deck{border-style:solid;flex:0 0 64px;max-width:64px;}
.trackcard.deck .tcount{
  font-family:var(--font-mono);
  font-size:.95rem;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.statusbar{
  position:relative;
  display:flex; flex-direction:column; gap:12px;
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; box-shadow:var(--shadow);
}
.topvote{
  position:absolute; bottom:10px; right:14px;
  display:flex; align-items:center; gap:6px;
  padding:4px 8px; background:rgba(0,0,0,0.15); border-radius:8px;
  font-size:12px; z-index:5;
}
.topvote-label{ font-size:11px; opacity:.85; white-space:nowrap; margin-right:2px; }
.topvote-btn{
  font-size:11px; padding:3px 8px; border-radius:6px;
  border:1px solid rgba(255,255,255,0.25); background:transparent; color:inherit;
  cursor:pointer; line-height:1.2; font-family:var(--font-body);
}
.topvote-btn:hover{ border-color:rgba(255,255,255,0.5); }
.topvote .chosen-aye{ background:var(--republic); border-color:var(--republic-strong); color:#fff; }
.topvote .chosen-nay{ background:var(--imperium); border-color:var(--imperium-strong); color:#fff; }
.avatar{
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:50%; color:#fff; font-weight:700; font-family:var(--font-body);
  text-transform:uppercase; flex-shrink:0; line-height:1;
}
.overlay{
  position:fixed; inset:0; background:var(--ground);
  display:flex; align-items:center; justify-content:center;
  padding:24px calc(16px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));
  padding-top:calc(24px + env(safe-area-inset-top,0px));
  z-index:50;
}
.overlay .card{max-width:420px;width:100%;text-align:center;}
.role-badge{
  font-family:var(--font-display);
  font-size:1.4rem;
  padding:18px 10px;
  border-radius:10px;
  letter-spacing:.03em;
}
.role-senator{background:var(--republic);color:#f4fff0;}
.role-conspirator{background:var(--imperium);color:#fff3ef;}
.role-imperator{background:var(--tyrian);color:#fff8ee;}
.decree-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.decree{
  width:82px;height:112px;border-radius:8px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--font-display);font-size:.75rem;padding:8px;cursor:pointer;
  background:var(--panel-2);
}
.decree.rp{border-color:var(--republic-strong);}
.decree.im{border-color:var(--imperium-strong);}
.decree:active{transform:scale(.96);}
.decree.selected{box-shadow:0 0 0 3px var(--gold-strong); border-color:var(--gold-strong);}
.voterow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.voterow:last-child{border-bottom:none;}
.togglepair{display:flex;gap:6px;}
.togglepair button{padding:8px 14px;font-size:.85rem;}
.togglepair button.chosen-aye{background:var(--republic);border-color:var(--republic-strong);color:#f4fff0;}
.togglepair button.chosen-nay{background:var(--imperium);border-color:var(--imperium-strong);color:#fff3ef;}
.log{
  font-family:var(--font-mono); font-size:.72rem; color:var(--ink-dim);
  display:flex;flex-direction:column;gap:4px; max-height:140px; overflow-y:auto;
  border-top:1px solid var(--line); padding-top:10px;
}
.center{text-align:center;}
.small{font-size:.82rem;color:var(--ink-dim);}
.small.warn{color:#8b1a1a;font-weight:600;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .small.warn{color:#f08d81;} }
:root[data-theme="dark"] .small.warn{color:#f08d81;}
details.card{padding:16px 20px;}
details.card summary{cursor:pointer;font-family:var(--font-display);font-size:1.02rem;color:var(--ink);list-style:none;}
details.card summary::-webkit-details-marker{display:none;}
details.card summary::before{content:'\25B8 ';color:var(--gold-strong);}
details.card[open] summary::before{content:'\25BE ';}
details.card[open]{gap:10px;}
details.card > *:not(summary){font-size:.82rem;color:var(--ink-dim);line-height:1.5;}
details.card > div{margin-top:4px;}
.card details:not(.card){margin-top:2px;}
.card details:not(.card) summary{cursor:pointer;font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-strong);list-style:none;}
.card details:not(.card) summary::-webkit-details-marker{display:none;}
.card details:not(.card) summary::before{content:'\25B8 ';}
.card details:not(.card)[open] summary::before{content:'\25BE ';}
.card details:not(.card) > div{font-size:.82rem;color:var(--ink-dim);line-height:1.5;margin-top:8px;}
.playerchip{
  padding:10px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel-2); display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.playerchip.dead{opacity:.45;text-decoration:line-through;}
.seats{display:flex;flex-wrap:wrap;gap:8px;}
.seat{
  padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--panel-2); display:flex;flex-direction:column;align-items:center;gap:4px;
  min-width:68px; text-align:center;
}
.seat.dead{opacity:.4;}
.seat.dead .seatname{text-decoration:line-through;}
.seat.princeps{border-color:var(--gold-strong);box-shadow:0 0 0 1px var(--gold-strong) inset;}
.seat.consul{border-color:var(--tyrian-strong);box-shadow:0 0 0 1px var(--tyrian-strong) inset;}
.seat.princeps.consul{box-shadow:0 0 0 1px var(--gold-strong) inset, 0 0 0 3px var(--tyrian-strong) inset;}
.seatname{font-family:var(--font-body);font-size:.82rem;color:var(--ink);}
.seatyou{font-family:var(--font-mono);font-size:.62rem;color:var(--ink-dim);}
.seatbadges{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
.seatbadge{
  font-family:var(--font-display);font-size:.56rem;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 7px;border-radius:6px;color:#fff8ee;
}
.seatbadge.princeps{background:var(--gold-strong);}
.seatbadge.consul{background:var(--tyrian-strong);}
.namebtn{
  text-align:left; background:var(--panel-2); border:1px solid var(--line);
  border-radius:10px; padding:14px 16px; font-family:var(--font-body); font-size:1rem;
}
.namebtn.selected{background:var(--tyrian);border-color:var(--tyrian-strong);color:#fff8ee;}
.select{
  width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; font-family:var(--font-body); font-size:.9rem; color:var(--ink);
  margin:10px 0;
}
.speechBubble{
  display:flex; align-items:flex-start; gap:10px;
  background:var(--panel-2); border:1px solid var(--gold-strong); border-radius:12px;
  padding:10px 14px; margin:0 0 12px 0;
}
.speechBubbleBody{display:flex; flex-direction:column; gap:2px; min-width:0;}
.speechBubbleName{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.06em; color:var(--gold-strong); text-transform:uppercase;}
.speechBubbleText{font-size:.92rem; font-style:italic; color:var(--ink); word-wrap:break-word;}
.badge-consul{color:var(--gold-strong);font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;}
.tutorialCallout{
  position:relative;
  border:1.5px solid var(--gold-strong);
  background:var(--panel-2);
  border-radius:10px;
  padding:12px 14px 14px;
  margin:2px 0 14px 0;
}
.tutorialCallout .eyebrow{margin-bottom:2px;}
.tutorialCallout .calloutArrow{
  position:absolute; left:26px; bottom:-8px;
  width:15px; height:15px;
  background:var(--panel-2);
  border-right:1.5px solid var(--gold-strong);
  border-bottom:1.5px solid var(--gold-strong);
  transform:rotate(45deg);
}
.notesCard{padding:8px 14px; margin-bottom:12px;}
.notesCard summary{font-family:var(--font-mono); font-size:.72rem;letter-spacing:.05em; text-transform:uppercase; color:var(--gold-strong); cursor:pointer; padding:4px 0;}
.waxTablet{
  width:100%; min-height:56px; max-height:160px; resize:vertical; margin-top:8px;
  background:linear-gradient(var(--panel-2),var(--panel-2)), repeating-linear-gradient(var(--panel-2) 0 27px, var(--line) 27px 28px);
  background-blend-mode:normal; border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; font-family:var(--font-body); font-size:.85rem; line-height:1.5;
  color:var(--ink); box-shadow:inset 0 1px 4px rgba(0,0,0,.25);
}
.waxTablet::placeholder{color:var(--ink-dim,#9a8f7d); opacity:.7;}
.dots{display:inline-flex;gap:4px;vertical-align:middle;}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--gold-strong);opacity:.35;animation:pulse 1.1s infinite ease-in-out;}
.dots span:nth-child(2){animation-delay:.15s;}
.dots span:nth-child(3){animation-delay:.3s;}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}
@media (prefers-reduced-motion: reduce){.dots span{animation:none;opacity:.7;}}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>

<div id="app"></div>

<script>
(function(){
"use strict";

/* ---------- Fonts ---------- */
var link1=document.createElement('link');
link1.rel='stylesheet';
link1.href='https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap';
document.head.appendChild(link1);

/* ---------- Constants ---------- */
var ROLE_COUNTS = {
  5:{senator:3,conspirator:1,imperator:1},
  6:{senator:4,conspirator:1,imperator:1},
  7:{senator:4,conspirator:2,imperator:1},
  8:{senator:5,conspirator:2,imperator:1},
  9:{senator:5,conspirator:3,imperator:1},
  10:{senator:6,conspirator:3,imperator:1}
};
var POWER_TABLE = {
  micro:{3:'investigate',4:'proscribe'},              // 2-4 players
  small:{3:'investigate',4:'proscribe',5:'proscribe'}, // 5-6 players — Foresight replaced with Investigate Loyalty, matching the 2-4 player deck
  mid:{2:'investigate',3:'special_election',4:'proscribe',5:'proscribe'}, // 7-8
  large:{1:'investigate',2:'investigate',3:'special_election',4:'proscribe',5:'proscribe'} // 9-10
};
// Short, dismissible, non-blocking pop-up tips for the Tutorial. Each tip is
// tied to a specific S.phase AND rendered inline, right next to the exact
// control it explains — with a small arrow pointing at it — instead of as a
// generic banner floating above the whole screen. TUTORIAL_TIP_ORDER fixes
// the sequence; a phase can have more than one tip (e.g. 'nominate' shows
// the status-bar/track explainer before the nominate-list one), and only the
// single next unseen tip whose phase matches S.phase is ever shown at once,
// so a first-time player is never shown more than one thing to read at a
// time. Dismissing (or just acting) marks that one tip seen for good —
// nothing here ever blocks the underlying action.
var TUTORIAL_TIP_ORDER = ['track','nominate','vote','princeps_draw','consul_draw','power_intro'];
var TUTORIAL_TIPS = {
  track: {
    phase: 'nominate',
    text: 'This is the status bar: your role, who\'s Princeps and Consul this round, and the two tracks below — Res Publica for the Senate, Imperium for the Conspiracy. Whichever track fills up first decides who wins, so keep an eye on it all game.'
  },
  nominate: {
    phase: 'nominate',
    text: 'You\'re the Princeps this round. Tap anyone below to nominate them as Consul — there\'s no wrong answer yet, you\'ll get better clues as the game goes on — then put it to a vote.'
  },
  vote: {
    phase: 'vote',
    text: 'Everyone votes out loud, so every vote (including the bots\', shown as you look) is visible. Use the Aye/Nay buttons on your own row below. Aye confirms that Princeps &amp; Consul pair; Nay rejects them — vote however you honestly feel, the bots are watching how you vote, too.'
  },
  princeps_draw: {
    phase: 'legis_princeps_draw',
    text: 'You\'re the Princeps: you see 3 decrees below. Tap 2 of them to hand to the Consul — the one you leave unpicked is discarded, unseen by anyone else.'
  },
  consul_draw: {
    phase: 'legis_consul_draw',
    text: 'You\'re the Consul: tap the 1 decree below you want to enact. The other is discarded, unseen by anyone else — and whichever you enact moves one of the tracks up top.'
  },
  power_intro: {
    phase: 'power_intro',
    text: 'Enough Imperium Decrees just unlocked a power for the Princeps — tap Continue below to use it, it\'s a real edge.'
  }
};
// The single next tip to show right now, or null — always at most one on
// screen at a time, and only ever for the tutorial.
function activeTutorialTip(){
  if(!S.tutorialMode) return null;
  for(var i=0;i<TUTORIAL_TIP_ORDER.length;i++){
    var id = TUTORIAL_TIP_ORDER[i];
    var tip = TUTORIAL_TIPS[id];
    if(tip.phase===S.phase && !S.tutorialSeen[id]) return id;
  }
  return null;
}
// Rendered inline, immediately before the exact control it explains — the
// little rotated-square "calloutArrow" sits on its bottom edge, pointing
// down at whatever comes right after it in the page.
function tutorialCalloutHtml(id){
  var tip = TUTORIAL_TIPS[id];
  if(!tip) return '';
  return '<div class="tutorialCallout"><div class="eyebrow">Tutorial</div><p class="small">'+tip.text+'</p>' +
    '<button class="ghost full" data-tutorial-dismiss="'+id+'">Got it</button>' +
    '<div class="calloutArrow"></div></div>';
}

var POWER_LABEL = {
  investigate:'Investigate Loyalty',
  special_election:'Call Special Comitia',
  peek:'Foresight',
  proscribe:'Proscribe'
};
var POWER_ICON = {

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function freshDeck(){
  var d=[];

  for(var i=0;i<14;i++)d.push('IM');

}

function alivePlayers(){ return S.players.filter(function(p){return p.alive;}); }

// Difficulty only ever adjusts how good the OTHER bot seats are — never the
// human's own decisions (there's no dial for those). "Teammate" bots share
// the human's team (senate or conspiracy, whichever the human was dealt);
// "opponent" bots are on the other team. Each tier is the probability a bot
// uses its real, strategic decision logic on any given call; the rest of
// the time it falls through to a naive/random fallback baked into that same
// function (see smartRoll's call sites: botChooseNominee, botVoteChoice,
// botDiscardChoice, botEnactChoice, botVetoChoice, the veto-propose trigger
// in princepsDiscard, botInvestigateChoice, botSpecialChoice, botProscribeChoice).
var SKILL_TIERS = {
  perfect: 1.00, // "impossible" opponents — plays almost perfectly
  great:   0.90, // "easy" teammates / "hard" opponents
  average: 0.65, // "medium" teammates and opponents
  bad:     0.30, // "easy" opponents / "hard" teammates
  poor:    0.12  // "impossible" teammates — not so sensible
};
var DIFFICULTY_TABLE = {
  easy:       {teammate:'great',   opponent:'bad'},
  medium:     {teammate:'average', opponent:'average'},
  hard:       {teammate:'bad',     opponent:'great'},
  impossible: {teammate:'poor',    opponent:'perfect'}
};
function botSkillProb(bot){
  // Guided first game: every bot always plays its true side optimally —
  // no "difficulty" randomness at all. Without this, a genuinely honest
  // Senator could still randomly enact Imperium (or a Conspirator randomly
  // enact Res Publica) on a failed skill roll, which looks exactly like
  // deception to a brand-new player even though it's just simulated
  // carelessness. Combined with sleepers/bluffing being off, tutorial bots
  // behave with zero noise — the cleanest possible signal to learn from.
  if(S.tutorialMode) return 1;
  var h = humanPlayer();
  if(!h) return 1; // no seated human (shouldn't happen mid-game) — default to full skill
  var tiers = DIFFICULTY_TABLE[S.difficulty] || DIFFICULTY_TABLE.medium;
  var tierName = (bot.team===h.team) ? tiers.teammate : tiers.opponent;
  var prob = SKILL_TIERS[tierName];
  return prob===undefined ? 1 : prob;
}
function smartRoll(bot){
  return Math.random() < botSkillProb(bot);
}

/* ---------- Game history (last 3 games, saved to this browser only) ---------- */
var GAME_HISTORY_KEY = 'conspirators_of_rome_history_v1';
var GAME_HISTORY_MAX = 3;

function buildGameRecord(){
  return {
    timestamp: Date.now(),
    count: S.count,
    includeImperator: S.includeImperator,
    winner: S.winner,
    winReason: S.winReason,
    players: S.players.map(function(p){
      return {name:p.name, role:p.role, team:p.team, isHuman:!!p.isHuman, alive:p.alive};
    }),
    investigateLog: S.investigateLog.slice(),
    peekLog: S.peekLog.slice(),
    log: S.log.slice().reverse(), // chronological, oldest first — the FULL record, not the 12-line display window
    // Final trust readings: each living player's own private, subjective
    // suspicion score (0-100, "how Conspiracy-like they look to ME") for
    // everyone else, as it stood at game end. This is genuinely private
    // per-observer state, never shown during play — safe to reveal only now,
    // alongside the full role reveal.
    // Every living player gets a card here — PLUS the human specifically,
    // even if they were proscribed before the game ended: it's their own
    // private reading and they should always be able to see it, unlike a
    // bot's, which only matters while it's still shaping that bot's play.
    suspicion: S.players.filter(function(o){ return o.alive || o.isHuman; }).map(function(observer){
      return {
        name: observer.name,
        isHuman: !!observer.isHuman,
        alive: observer.alive,
        readings: S.players.filter(function(p){ return p.id!==observer.id; }).map(function(p){
          var intel = observer.intel[p.id];
          return {
            name: p.name,
            alive: p.alive,
            score: Math.round(observer.suspicion[p.id]===undefined ? SUSPICION_START : observer.suspicion[p.id]),
            confirmed: intel==='loyal' ? 'confirmed loyal' : (intel==='enemy' ? 'confirmed enemy' : null)
          };
        })
      };
    })
  };
}

function saveGameToHistory(){
  try{
    var record = buildGameRecord();
    var existing = loadGameHistory();
    existing.unshift(record);
    if(existing.length > GAME_HISTORY_MAX) existing = existing.slice(0, GAME_HISTORY_MAX);
    localStorage.setItem(GAME_HISTORY_KEY, JSON.stringify(existing));
  }catch(e){ /* localStorage unavailable, full, or blocked — never let history saving break the game */ }
}

function loadGameHistory(){
  try{
    var raw = localStorage.getItem(GAME_HISTORY_KEY);
    var parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  }catch(e){ return []; }
}

function copyTextToClipboard(text, btn){
  function flash(ok){
    if(!btn) return;
    var original = btn.getAttribute('data-original-label') || btn.textContent;
    btn.setAttribute('data-original-label', original);
    btn.textContent = ok ? 'Copied!' : 'Copy failed — try selecting the text manually';
    setTimeout(function(){ btn.textContent = original; }, 1800);
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ flash(true); }).catch(function(){ flash(false); });
      return;
    }
  }catch(e){}
  try{
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    flash(ok);
  }catch(e){ flash(false); }
}

function formatGameRecordText(record){
  var lines = [];
  lines.push('The Conspirators of Rome — game played ' + new Date(record.timestamp).toLocaleString());
  lines.push(record.count + ' players' + (record.count<=4 ? (record.includeImperator?' (Imperator included)':' (Imperator omitted)') : ''));
  lines.push('Winner: ' + (record.winner==='senate' ? 'The Senate' : 'The Conspirators'));
  lines.push('Reason: ' + record.winReason);
  lines.push('');
  lines.push('Full reveal:');
  record.players.forEach(function(p){
    lines.push('- ' + p.name + (p.isHuman?' (you)':'') + ': ' + roleLabel(p.role) + (p.alive?'':' (removed from play)'));
  });
  if(record.investigateLog.length || record.peekLog.length){
    lines.push('');
    lines.push('Investigations & Foresight:');
    record.investigateLog.forEach(function(e){ lines.push('- ' + e.investigatorName + ' investigated ' + e.targetName + ' -> ' + e.result); });
    record.peekLog.forEach(function(e){ lines.push('- ' + e.name + ' used Foresight'); });
  }
  lines.push('');
  lines.push('Record of the Senate:');
  record.log.forEach(function(l){ lines.push('- ' + l); });
  if(record.suspicion && record.suspicion.length){
    lines.push('');
    lines.push('Final trust readings (private per-player suspicion, 0-100, never visible during play):');
    record.suspicion.forEach(function(observer){
      lines.push('As seen by ' + observer.name + (observer.isHuman?' (you)':'') + ':');
      observer.readings.slice().sort(function(a,b){ return b.score-a.score; }).forEach(function(r){
        lines.push('  - ' + r.name + (r.alive?'':' (removed)') + ': ' + r.score + (r.confirmed?' ('+r.confirmed+')':''));
      });
    });
  }
  return lines.join('\n');
}

function beginReveal(){
  var botCount = S.count-1;
  var pool = shuffle(ROMAN_BOT_NAMES).slice(0,botCount);
  var humanName = (S.humanName||'').trim() || 'You';
  var names = [humanName].concat(pool);

  var roles;
  if(S.tutorialMode){
    // Guided first game: a fixed, guaranteed deal instead of the normal
    // random small-pool slice — 2 Senators + 1 Conspirator, always, so
    // there's always exactly one straightforward spy to learn to spot.
    roles = shuffle(['senator','senator','conspirator']);
  } else if(smallGame()){
    var pool = buildSmallPool(S.count, S.includeImperator && S.count>=3);
    roles = shuffle(pool).slice(0, S.count);
  } else {
    var counts = ROLE_COUNTS[S.count];
    roles = [];
    for(var i=0;i<counts.senator;i++) roles.push('senator');
    for(var i=0;i<counts.conspirator;i++) roles.push('conspirator');
    for(var i=0;i<counts.imperator;i++) roles.push('imperator');
    roles = shuffle(roles);
  }

  if(S.tutorialMode && roles[0]!=='senator'){
    // Guided first game: keep it simple by always starting the human as a
    // Senator (nothing to bluff about on turn one) — swap with whichever
    // senator would otherwise have landed elsewhere.
    var senatorSlot = roles.indexOf('senator');
    if(senatorSlot!==-1){ roles[senatorSlot] = roles[0]; roles[0] = 'senator'; }
  }

  var players = names.map(function(n,i){
    return {id:i, name:n, role:roles[i], alive:true, isHuman:(i===0)};
  });
  players = shuffle(players);
  players.forEach(function(p,i){p.seat=i;});
  players.sort(function(a,b){return a.seat-b.seat;});

  players.forEach(function(p){
    p.team = p.role==='senator' ? 'senate' : 'conspiracy';
    p.intel = {};
    p.investigated = false;
    p.suspicion = {};       // targetId -> 0-100 public "looks like Conspiracy" estimate, everyone starts at 50
    p.observedTerms = {};   // targetId -> how many legislative terms we've seen them serve (princeps or consul)
  });
  players.forEach(function(p){
    // Some Conspirators (and the Imperator) start the game as "sleepers" —
    // not every game, just a probability — who deliberately play it safe
    // (favoring Res Publica like a Senator would) to stay below suspicion,
    // banking trust they can spend later: staying off the proscription
    // list, or getting waved through as Consul without scrutiny. Most
    // Conspirators still play the honest-but-self-interested way (push
    // Imperium whenever they can) — sleepers are the exception, not the rule.
    // Guided first game: bots play their side plainly — Senators push
    // Res Publica, Conspirators push Imperium, nobody fakes being the
    // other side. No sleepers there, so the tell is always readable.
    p.sleeper = (!S.tutorialMode) && (p.team==='conspiracy') &&
      (Math.random() < (p.role==='imperator' ? SLEEPER_PROBABILITY_IMPERATOR : SLEEPER_PROBABILITY_CONSPIRATOR));
    p.exposedTo = [];   // ids of living players who hold CONFIRMED intel that this player is an enemy (from an honest Investigate Loyalty)
    p.nayVotesReceived = []; // ids of every player who has EVER voted Nay on this player as a Consul nominee — an objective, public fact (votes are cast in full view), used to retroactively vindicate early skeptics once someone confirms this player really was an enemy
  });
  players.forEach(function(p){
    p.allies = p.team==='conspiracy' ? conspiratorTeammates(p, players).map(function(t){return t.id;}) : [];
  });

  S.players = players;
  S.deck = freshDeck();
  S.discardPile = [];
  S.princepsIndex = 0;
  if(S.tutorialMode){
    // Tutorial: the player must start as Princeps — otherwise the very
    // first thing they'd see is a bot's turn (a self-moving "Curia waits"
    // screen) with no action of their own to anchor the tips to, which is
    // meaningless to someone who doesn't know the game yet.
    var humanIdx = players.findIndex(function(pl){ return pl.isHuman; });
    if(humanIdx!==-1) S.princepsIndex = humanIdx;
  }
  S.revealShown = false;
  S.phase = 'reveal';
  S.log = ['The lots have been drawn. '+S.count+' senators enter the Curia — you, and '+botCount+' others.'];
  render();
}

function buildSmallPool(count, includeImperator){
  // 2 players draw from a pool of 2 Senators + 2 Conspirators.
  // 3-4 players draw from a pool of 3 Senators + 2 Conspirators.
  // Only as many cards as there are players are dealt — the rest sit out unseen.
  var pool = (count<=2)
    ? ['senator','senator','conspirator','conspirator']
    : ['senator','senator','senator','conspirator','conspirator'];
  if(includeImperator){
    var idx = pool.indexOf('conspirator');
    if(idx!==-1) pool[idx] = 'imperator';
  }
  return pool;
}

function conspiratorTeammates(player, playersList){
  var list = playersList || S.players;
  var conspirators = list.filter(function(p){return p.role==='conspirator' || p.role==='imperator';});
  if(smallGame()){
    return []; // 2-4 players: nobody is shown their allies at reveal — everyone must feel their way
  }
  if(player.role==='imperator'){
    if(S.count<=6){
      return conspirators.filter(function(p){return p.id!==player.id;});
    }
    return []; // large games: imperator does not know conspirators
  }
  return conspirators.filter(function(p){return p.id!==player.id;});
}

// What a player actually, legitimately knows about their own team right now —
// not the ground-truth ally list. Standard-size Conspirators know their team
// from the start; everyone else (Senators always, and everyone in a small
// 2-4 player Senate) only learns a teammate by personally confirming them
// "Loyal" with Investigate Loyalty.
function knownAllies(player){
  if(!smallGame() && player.team==='conspiracy') return player.allies.slice();
  var known = [];
  for(var pid in player.intel){
    if(player.intel[pid]==='loyal') known.push(parseInt(pid,10));
  }
  return known;
}

/* ---------- Bot decision logic ----------
   Bots play strategically but never deceptively: there is no bluffing, no
   false claims, no faked votes — every bot's own moves (what it enacts,
   how it votes, who it targets) always follow its real role's true
   interest. The "strategy" is entirely in how each bot READS the other
   players: it watches the same public information a sharp human would
   (who served as Princeps/Consul, and whether a Res Publica or an Imperium
   Decree came out of it) and keeps a running, probability-weighted
   suspicion score on everyone at the table, the way real deduction-game
   players do "policy math". See the constants below for the exact numbers.

   TRUST/SUSPICION MODEL
   ----------------------
   - Every player keeps p.suspicion[targetId]: a 0-100 score, "how likely
     does target look like Conspiracy", starting at 50 (neutral) for
     everyone. It is PUBLIC reasoning — every bot updates it identically
     off the same public event, exactly like a human counting cards would.
   - Every player keeps p.observedTerms[targetId]: how many legislative
     terms we've watched target serve as Princeps or Consul — our sample
     size on them.
   - Personal Investigate Loyalty results are PRIVATE and stored in the
     existing p.intel map ('loyal'/'enemy', relative to the investigator's
     own team) — those are near-certainty and override the public score
     entirely for that one observer's decisions.
   - After every legislative session (not counting Chaos, where nobody
     chose anything), every living player's suspicion score for that
     round's Princeps and Consul moves up (Imperium enacted) or down
     (Res Publica enacted). The size of the move is scaled by how
     "avoidable" the outcome plausibly was, using real card-counting: the
     public Discarded/Remaining counters mean anyone can work out how many
     Res Publica and Imperium Decrees are still unseen, so we compute the
     probability that an honest draw could have been forced into that
     outcome anyway. A bad decree when the deck was stacked with Imperium
     Decrees is barely suspicious (probably just unlucky); the same bad
     decree when the deck still had plenty of Res Publica left is very
     suspicious (probably mischief). Consul moves further than Princeps,
     since the Consul has the final say between two decrees. */
var SUSPICION_START = 50;
var BASE_IM_SUSPICION = 18;   // max suspicion Consul gains for an Imperium Decree
var BASE_RP_TRUST     = 14;   // max suspicion Consul loses for a Res Publica Decree
var PRINCEPS_WEIGHT   = 0.45; // Princeps' own delta is scaled down by this much vs Consul's
var MIN_FORCED_FACTOR = 0.15; // even a fully "forced" outcome still carries a little signal
var TEST_GRAY_LOW = 35, TEST_GRAY_HIGH = 65; // suspicion band considered "still worth testing"
var TEST_MAX_SAMPLE = 1;      // fewer than this many observed terms counts as "under-tested"
var TEST_PROBABILITY = 0.6;   // chance a bot acts on the urge to test someone, vs. its default pick
var NAIVE_SENATE_AYE_PROBABILITY = 0.75; // unskilled Senate vote fallback: basic civic trust by default, not a 50/50 coin flip
var SENATE_NAY_THRESHOLD = 70;        // Senate votes Nay once suspicion crosses this, normally
var SENATE_NAY_THRESHOLD_CAUTION = 62; // ...but once caution mode kicks in (see inCaution), a lower bar is enough — now applies in EVERY game size, not just standard
var SENATE_NAY_THRESHOLD_CAUTION_LARGE = 56; // 7-10p specifically: the Conspiracy's guaranteed-aye voting bloc is a larger fraction of the table there, so it takes even less suspicion to trigger a Nay once caution mode is active
var CONSPIRACY_OBSTRUCTION_RP_PROGRESS = 0.6; // Conspiracy's late-game obstruction behavior only kicks in once the Senate has reached this fraction of its Res Publica win condition (0.6 = 3 of 5 Decrees)
var CONSPIRACY_OBSTRUCTION_TRUST_THRESHOLD = 40; // ...and only against a Princeps/Consul pairing that looks this trustworthy or better (lower = safer-looking)
var CONSPIRACY_OBSTRUCTION_PROBABILITY = 0.4; // a probability, not the default — most Conspirators still back every government even late, see conspiratorPlaysCover for the sleeper exception
var VOTE_TRUST_SHIFT = 5;      // how much a single vote's trust signal moves an observer's suspicion of the voter — a smaller nudge than legislative evidence (BASE_IM_SUSPICION/BASE_RP_TRUST), since voting is a noisier tell
var VOTE_TRUST_RISKY = 60;     // a nominee/princeps pairing the observer rates this suspicious or worse — voting Aye on it is a Conspiracy-like tell
var VOTE_TRUST_SAFE = 40;      // a pairing the observer rates this trustworthy or better — voting Nay on it is a tell too (the new late-game obstruction behavior, or genuine paranoia)
var RETRO_VINDICATION_SHIFT = 10; // when an observer confirms someone is an enemy via Investigate Loyalty, everyone who had EVER voted Nay on that person gets this much LESS suspicious in that observer's eyes — they were right to be wary, whether or not they could prove it at the time
var PROSCRIBE_TRUST_MAX_SHIFT = 12; // proscribing a player who looked suspicious earns the Princeps this much LESS suspicion (at most) in every other observer's eyes — scaled by how suspicious the proscribed target actually looked to that observer, so removing a barely-suspected senator earns little, removing someone near-certainly an enemy earns close to the full amount
var PROSCRIBE_TIE_BAND = 5;    // candidates within this many points of the top suspicion tie for the pick
var CAUTION_IM_CARDS = 3;      // caution mode starts once this many Imperium Decrees are enacted...
var CAUTION_TOTAL_CARDS = 5;   // ...or once this many total decrees are enacted, whichever comes first
var PUBLIC_NOTICE_ROUNDS = 3;  // how many legislative rounds an "X investigated Y" notice stays visible to everyone
var SLEEPER_PROBABILITY_CONSPIRATOR = 0.30; // rank-and-file Conspirators
var SLEEPER_PROBABILITY_IMPERATOR   = 0.50; // the Imperator benefits far more from staying hidden
var SLEEPER_COVER_THRESHOLD = 58;    // a sleeper keeps up the act while their own perceived suspicion stays under this
var SLEEPER_BASE_COVER_CHANCE = 0.9;     // sleeper archetype: high baseline appetite for cover, still scaled by skill (see conspiratorPlaysCover)
var NON_SLEEPER_BASE_COVER_CHANCE = 0.18; // non-sleeper: a much smaller baseline, but not zero — a sharp (high-skill) Conspirator can still recognize a cheap cover opportunity
var SLEEPER_LATE_DEFECT_CHANCE = 0.15; // even mid-cover, a small per-turn chance to cash in early rather than wait it out
var SLEEPER_EXPOSED_DEFECT_BONUS = 0.25; // extra per-turn defect chance added for EACH living player who holds confirmed intel on you
var RUSH_IM_PROGRESS = 0.7;   // Conspiracy abandons the sleeper act once their own Imperium count is this fraction of the win threshold
var EMERGENCY_RP = 4;         // Conspiracy abandons the sleeper act once the Senate has this many Res Publica Decrees (one shy of winning)
var URGENT_IM_MARGIN = 1;     // Senate tightens its proscribe pick once the Conspiracy is within this many Imperium Decrees of winning (standard 5-10p games)
var URGENT_IM_MARGIN_SMALL = 1; // same idea, tuned separately for 2-4p games (5-card threshold instead of 6, faster-moving track)
var URGENT_PROSCRIBE_TIE_BAND = 1; // narrower tie band used under that urgency (replaces the normal PROSCRIBE_TIE_BAND)
var FRIENDLY_FIRE_HEDGE_BAND = 10; // in small games with no confirmed allies, widens the "most trustworthy" proscribe pool by this much so a Conspirator isn't guaranteed to lock onto its own best-hidden teammate

var CLAIM_SILENCE_PROBABILITY = 0.35;      // baseline chance a bot says nothing at a given decision point
var CONSUL_BLUFF_FORCED_PROBABILITY = 0.55; // an uncovered Conspiracy Consul who took a REAL choice (mixed hand) and enacted Imperium: chance they falsely claim "I had no choice" to protect cover
var CONSUL_MIXED_HAND_VETO_PROBABILITY = 0.25; // a cover-caring Conspiracy Consul holding a mixed (1RP+1IM) hand: chance they propose a veto INSTEAD of taking the free Imperium, purely to avoid the ground-truth tell that enacting it would trigger
var INVESTIGATOR_HONEST_REVEAL_PROBABILITY = 0.6; // a Senate investigator: chance they publicly state the TRUE result rather than staying private
var INVESTIGATOR_FRAME_PROBABILITY = 0.35;  // a Conspiracy investigator who found a real Senator (their enemy): chance they falsely publicly claim that Senator is "enemy" — framing an innocent target
var INVESTIGATOR_PROTECT_ALLY_LIE_PROBABILITY = 0.15; // a Conspiracy investigator who found a fellow Conspirator/Imperator (an ally): small chance they falsely claim "enemy" about their OWN ally as an aggressive misdirection play
var CLAIM_TRUST_NUDGE = 3;   // small, bounded suspicion nudge from a claim's TONE alone (reassuring lowers, evasive raises) — deliberately much smaller than real-evidence deltas like BASE_IM_SUSPICION(18)/BASE_RP_TRUST(14)
var FALSE_VOUCH_PENALTY = 14; // retrospective suspicion penalty (in one observer's eyes) applied to anyone who had publicly vouched a now-confirmed-enemy as "loyal" (ir_loyal claim) — and the same amount of REWARD to anyone who had publicly called them "enemy" (ir_enemy claim) — see markConfirmedEnemy

// The bots' (and the human's, via a matching dropdown) small talk: brief,
// canned lines a player can offer to justify a move — honest or a bluff,
// always optional (silence is never excluded). `tone` drives a small,
// bounded universal trust nudge (applyClaimTone) independent of whether
// the line is actually true — other players can only judge HOW something
// was said, not verify it, except where ground truth catches an outright
// lie (see markConfirmedEnemy and the mixed-hand Imperium tell).
var DIALOGUE = {
  discard: {
    d_no_choice:    {text:'All three cards were the same — I had no real choice to make.', tone:'reassuring'},
    d_mixed_hand:   {text:"I'm handing over a real mix — make of it what you will.", tone:'neutral'},
    d_tough_call:   {text:'That was a difficult discard. I did what I thought was right.', tone:'neutral'},
    d_trust_me:     {text:'Trust me, I discarded in good faith.', tone:'evasive'},
    d_deflect:      {text:'Whatever happens next is on the Consul, not me.', tone:'evasive'}
  },
  enact: {
    e_forced_im:      {text:'I received two Imperium cards, so I had no choice.', tone:'reassuring'},
    e_forced_rp:      {text:'Both cards were Res Publica — an easy call.', tone:'reassuring'},
    e_reluctant_im:   {text:"I didn't love enacting that, but it was the better of two bad options.", tone:'neutral'},
    e_proud_rp:       {text:'Glad to strengthen the Republic with that one.', tone:'reassuring'},
    e_blame_princeps: {text:'Whatever card I got, blame whoever handed it to me.', tone:'evasive'}
  },
  veto_propose: {
    v_forced_bad:  {text:"Both decrees were dangerous — I'd rather we scrap them both.", tone:'reassuring'},
    v_protect_all: {text:'Better a wasted term than a decree neither of us wants.', tone:'neutral'},
    v_no_reason:   {text:'No comment on why — just trust me on this one.', tone:'evasive'}
  },
  veto_accept: {
    va_agree:     {text:'Agreed — best we discard both and move on.', tone:'neutral'},
    va_relief:    {text:"Relief, honestly — let's move on.", tone:'reassuring'},
    va_reluctant: {text:"Not thrilled, but I'll allow it.", tone:'neutral'}
  },
  veto_refuse: {
    vr_refuse:   {text:'No — you drew them, you decide.', tone:'neutral'},
    vr_own_it:   {text:'You made your bed — enact it.', tone:'evasive'},
    vr_no_games: {text:"I won't let us dodge this one.", tone:'reassuring'}
  },
  vote: {
    ay_trust:      {text:'I trust {target} in this pairing. Aye.', tone:'reassuring'},
    ay_risk:       {text:"Not without risk, but I'll back {target}. Aye.", tone:'neutral'},
    ay_habit:      {text:'Aye on {target}, same as always.', tone:'evasive'},
    na_suspicious: {text:'Something about {target} worries me. Nay.', tone:'reassuring'},
    na_caution:    {text:'Too risky backing {target} at this point. Nay.', tone:'neutral'},
    na_pattern:    {text:"{target}'s voting pattern doesn't sit right with me. Nay.", tone:'reassuring'}
  },
  nominate: {
    n_safe: {text:"I believe in {target} — they've earned my trust.", tone:'reassuring'},
    n_test: {text:'I want to see how {target} handles it.', tone:'neutral'},
    n_gut:  {text:'Gut feeling on {target}, nothing more.', tone:'evasive'}
  },
  investigate_reveal: {
    ir_loyal:        {text:"I can confirm — {target} is loyal to the Republic.", tone:'reassuring'},
    ir_enemy:        {text:'I can confirm — {target} serves the conspiracy.', tone:'reassuring'},
    ir_private:      {text:"I'd rather keep that to myself for now.", tone:'evasive'},
    ir_inconclusive: {text:"The result wasn't as clear as I'd hoped.", tone:'evasive'}
  },
  proscribe: {
    p_certain:   {text:'I am certain of this. {target} must be proscribed.', tone:'reassuring'},
    p_gut:       {text:"It's a gut call on {target}, but I stand by it.", tone:'neutral'},
    p_regret:    {text:'I take no pleasure in this, but Rome demands {target}\'s removal.', tone:'reassuring'},
    p_strategic: {text:'Removing {target} is simply the safest move right now.', tone:'evasive'}
  },
  // Its own set, distinct from `proscribe` above — those all assert
  // certainty and demand someone's removal, which makes no sense on a
  // term where nobody gets proscribed. These instead let a player explain
  // WHY they're holding off: naming a suspect without acting on them is a
  // legitimate, honest thing to say.
  proscribe_skip: {
    ps_named_wait: {text:"I have my eye on {target}, but not enough to act on it yet.", tone:'neutral'},
    ps_no_evidence:{text:"Nothing solid enough to move against anyone this term.", tone:'neutral'},
    ps_risky:      {text:"Proscribing the wrong person now would cost us more than it's worth.", tone:'evasive'},
    ps_watching:   {text:"I'd rather keep watching a while longer.", tone:'evasive'}
  },
  special_election: {
    s_confident: {text:'I trust {target} to lead the Senate well.', tone:'reassuring'},
    s_strategic: {text:"{target} is the strategic pick for what's coming.", tone:'neutral'},
    s_gut:       {text:'Just a hunch on {target}.', tone:'evasive'}
  }
};
function claimText(moment, id){ return DIALOGUE[moment] && DIALOGUE[moment][id]; }

// Small, universal trust nudge from HOW something was said, not what —
// applies to bot AND human speakers alike. Deliberately bounded well below
// the real-evidence deltas elsewhere (BASE_IM_SUSPICION=18, BASE_RP_TRUST=14,
// PROSCRIBE_TRUST_MAX_SHIFT=12) since this is flavor corroboration, not proof.
function applyClaimTone(speaker, tone){
  if(tone!=='reassuring' && tone!=='evasive') return;
  var delta = tone==='reassuring' ? -CLAIM_TRUST_NUDGE : CLAIM_TRUST_NUDGE;
  S.players.forEach(function(observer){
    if(observer.id===speaker.id) return;
    var cur = observer.suspicion[speaker.id]===undefined ? SUSPICION_START : observer.suspicion[speaker.id];
    observer.suspicion[speaker.id] = clamp100(cur + delta);
  });
}

// Speaks a claim (bot OR human — both are plain player objects) into the
// public log, or does nothing at all if claimId is falsy (silence, always
// a valid choice and never penalized on its own). `targetName`, when given,
// fills in any {target} placeholder — so a nomination, vote, investigate
// result, proscription or special election naming a specific person reads
// as "Lucius: 'I can confirm, Marcus is loyal to the Republic.'" instead of
// a vague "they/them". Claims that deliberately withhold information
// (staying private, silence) never carry a {target} token, so choosing not
// to share still works exactly as before.
function botSpeak(speaker, moment, claimId, targetName){
  if(!claimId){ S.lastSpeech = null; return null; }
  var entry = DIALOGUE[moment] && DIALOGUE[moment][claimId];
  if(!entry){ S.lastSpeech = null; return null; }
  var text = entry.text.indexOf('{target}')!==-1 ? entry.text.split('{target}').join(targetName || 'them') : entry.text;
  pushLog(speaker.name+': "'+text+'"');
  S.lastSpeech = {playerId:speaker.id, name:speaker.name, text:text};
  applyClaimTone(speaker, entry.tone);
  return entry;
}

// The unified "observer now has certain, ground-truth-grade proof target is
// an enemy" helper — used by the mixed-hand Imperium tell, a genuine
// Investigate Loyalty result, and a caught investigate-claim lie alike.
// Also applies the RETROSPECTIVE half of the dialogue system: anyone who
// had publicly vouched this now-confirmed enemy as "loyal" (an ir_loyal
// claim) looks correspondingly more suspicious in this observer's eyes —
// they were wrong, whether honestly mistaken or lying for them — and
// anyone who had publicly called them "enemy" (ir_enemy) looks more
// trustworthy, mirroring applyVindication's Nay-vote logic but for claims.
function markConfirmedEnemy(observer, target){
  if(observer.intel[target.id]==='enemy') return;
  observer.intel[target.id] = 'enemy';
  if(target.exposedTo.indexOf(observer.id)===-1) target.exposedTo.push(observer.id);
  applyVindication(observer, target);
  var vouches = S.investigateVouches[target.id];
  if(vouches){
    vouches.forEach(function(v){
      if(v.investigatorId===observer.id) return;
      var cur = observer.suspicion[v.investigatorId]===undefined ? SUSPICION_START : observer.suspicion[v.investigatorId];
      var delta = v.claimedLoyal ? FALSE_VOUCH_PENALTY : -FALSE_VOUCH_PENALTY;
      observer.suspicion[v.investigatorId] = clamp100(cur + delta);
    });
  }
}

function botDiscardClaim(bot, three){
  if(Math.random() < CLAIM_SILENCE_PROBABILITY) return null;
  var allSame = three[0]===three[1] && three[1]===three[2];
  if(allSame) return 'd_no_choice';
  return choose(['d_mixed_hand','d_tough_call','d_trust_me','d_deflect']);
}

// two = the 2 cards actually handed to the Consul; enactedCard = what they
// chose; handWasMixed = two[0]!==two[1]. THIS is the flagship bluff: an
// uncovered Conspirator/Imperator who had a real mixed hand and chose to
// enact Imperium anyway (the only way handWasMixed && enactedCard==='IM'
// can happen — see botEnactChoice) will often falsely claim "no choice"
// (e_forced_im) to protect their cover, exactly as if genuinely forced.
// The claim doesn't change what the Princeps privately knows (they already
// have certain ground truth from the act itself, see updatePublicSuspicion)
// — it only shapes what OTHER observers, who lack that ground truth, hear.
function botEnactClaim(bot, two, enactedCard, handWasMixed){
  if(Math.random() < CLAIM_SILENCE_PROBABILITY) return null;
  if(enactedCard==='IM'){
    if(!handWasMixed) return 'e_forced_im';
    // Tutorial: never falsely claim "no choice" when there really was one —
    // bots stay plainly aligned with their side instead of bluffing.
    if(S.tutorialMode) return choose(['e_reluctant_im', null]);
    if(Math.random() < CONSUL_BLUFF_FORCED_PROBABILITY) return 'e_forced_im';
    return choose(['e_reluctant_im', null]);
  }
  if(!handWasMixed) return 'e_forced_rp';
  return choose(['e_proud_rp','e_blame_princeps']);
}

// Used both when a veto is genuinely forced (forcedEnactmentHurtsTeam was
// true) and when a Conspiracy Consul is proposing purely to protect cover
// on a mixed hand — note the cover-play branch deliberately never picks
// 'v_forced_bad' (the "I had no choice" claim), since a savvy Conspirator
// avoids a checkable lie there and sticks to vaguer, unfalsifiable framing.
function botVetoProposeClaim(bot, trulyForced){
  if(Math.random() < CLAIM_SILENCE_PROBABILITY) return null;
  if(trulyForced) return choose(['v_forced_bad','v_protect_all']);
  return choose(['v_protect_all','v_no_reason', null]);
}
function botVetoAcceptClaim(bot){
  if(Math.random() < CLAIM_SILENCE_PROBABILITY) return null;
  return choose(['va_agree','va_relief','va_reluctant']);
}
function botVetoRefuseClaim(bot){
  if(Math.random() < CLAIM_SILENCE_PROBABILITY) return null;
  return choose(['vr_refuse','vr_own_it','vr_no_games']);
}
function botVoteClaim(bot, isAye){
  if(Math.random() < CLAIM_SILENCE_PROBABILITY) return null;
  return isAye ? choose(['ay_trust','ay_risk','ay_habit']) : choose(['na_suspicious','na_caution','na_pattern']);
}
function botNominateClaim(bot){
  if(Math.random() < CLAIM_SILENCE_PROBABILITY) return null;
  return choose(['n_safe','n_test','n_gut']);
}
// foundEnemy = true when the investigated target is really on the
// opposing team from `bot`. Returns {claimId, claimedLoyal} — claimedLoyal
// is a plain boolean (true='loyal' claimed, false='enemy' claimed) or null
// when staying private/silent, and feeds S.investigateVouches so a later
// confirmation can catch — and retroactively punish or reward — the claim.
function botInvestigateRevealClaim(bot, foundEnemy){
  if(bot.team==='senate'){
    if(Math.random() < INVESTIGATOR_HONEST_REVEAL_PROBABILITY){
      var id = foundEnemy ? 'ir_enemy' : 'ir_loyal';
      return {claimId:id, claimedLoyal: !foundEnemy};
    }
    return {claimId: choose(['ir_private','ir_inconclusive', null]), claimedLoyal:null};
  }
  if(foundEnemy){
    if(Math.random() < INVESTIGATOR_FRAME_PROBABILITY) return {claimId:'ir_enemy', claimedLoyal:false};
    return {claimId: choose(['ir_private','ir_inconclusive', null]), claimedLoyal:null};
  }
  if(Math.random() < INVESTIGATOR_PROTECT_ALLY_LIE_PROBABILITY) return {claimId:'ir_enemy', claimedLoyal:false};
  return {claimId: choose(['ir_private','ir_inconclusive', null]), claimedLoyal:null};
}
function botProscribeClaim(bot){
  if(Math.random() < CLAIM_SILENCE_PROBABILITY) return null;
  return choose(['p_certain','p_gut','p_regret','p_strategic']);
}
function botSpecialElectionClaim(bot){
  if(Math.random() < CLAIM_SILENCE_PROBABILITY) return null;
  return choose(['s_confident','s_strategic','s_gut']);
}
// A Conspiracy Consul (or Imperator) who still has something to protect —
// mirrors conspiratorPlaysCover's late-game gates but applies to ANY
// Conspiracy Consul in the moment, not just long-term sleepers, since this
// is a one-off tactical call, not a persistent role trait.
function consulValuesCover(bot){
  if(inCaution()) return false;
  if(imProgress() >= RUSH_IM_PROGRESS) return false;
  if(S.rp >= EMERGENCY_RP) return false;
  if(aliveExposers(bot).length > 0) return false;
  // Small strategic refinement: this used to ignore how suspicious the
  // Consul currently looks entirely, unlike the plain-card cover mechanic
  // (conspiratorPlaysCover), which already gives up once suspicion is past
  // SLEEPER_COVER_THRESHOLD — past that point the act isn't working, and a
  // veto request is itself a visible, slightly odd move that's better spent
  // (or not spent at all) than wasted propping up a cover that's already
  // blown. Bringing the veto-cover decision in line with that same
  // threshold keeps the two "stay in character" mechanisms consistent.
  if(averagePublicSuspicion(bot) >= SLEEPER_COVER_THRESHOLD) return false;
  return true;
}

function choose(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function nChooseK(n,k){
  if(k<0||k>n) return 0;
  k = Math.min(k, n-k);
  var r = 1;
  for(var i=0;i<k;i++){ r = r*(n-i)/(i+1); }
  return r;
}
// Probability that k cards drawn at random from a pool of `total` unseen
// cards (of which `ofType` are the type in question) are ALL that type.
function probAllKOfType(ofType, total, k){
  if(total<k) return 0;
  return nChooseK(ofType,k) / nChooseK(total,k);
}
// Bots (both sides) stop testing ambiguous players and default to their
// safe pick once the game reaches "caution mode" — 3 Imperium Decrees
// enacted (the same point standard games start risking an instant loss if
// the Imperator gets elected Consul) or 5 total decrees enacted, whichever
// comes first. Near that point a wrong guess, or a wasted turn gathering
// information that won't get used in time, can lose the game outright.
function inCaution(){ return S.im>=CAUTION_IM_CARDS || (S.rp+S.im)>=CAUTION_TOTAL_CARDS; }

// How trustworthy a player currently LOOKS to the rest of the table — the
// average of everyone else's raw suspicion score for them. Deliberately
// uses the raw public score, not getEffectiveSuspicion: a player has no
// legitimate way to know that someone privately confirmed them via
// Investigate Loyalty, only how their public track record reads.
function averagePublicSuspicion(bot){
  var others = alivePlayers().filter(function(p){ return p.id!==bot.id; });
  if(!others.length) return SUSPICION_START;
  var sum = others.reduce(function(a,observer){
    var v = observer.suspicion[bot.id];
    return a + (v===undefined ? SUSPICION_START : v);
  }, 0);
  return sum / others.length;
}

function aliveExposers(bot){
  // living players who hold confirmed intel that `bot` is an enemy
  return bot.exposedTo
    .map(function(id){ return byId(id); })
    .filter(function(p){ return p && p.alive; });
}
function imProgress(){ return S.im / imWinThreshold(); }
function rpProgress(){ return S.rp / 5; }

// Whether a Conspirator/Imperator plays a card OUT OF CHARACTER (the
// Senate-favored one) this specific turn to bank trust — never gated by a
// one-time "sleeper" roll alone. The cost checks below (caution mode,
// rushing the win, the Senate one Decree away, active exposure, suspicion
// already too high) decide when cover is even worth attempting — cheap
// now, not worth it later — and among the turns where it IS cheap, the
// chance a Conspirator actually recognizes and takes that opening scales
// directly with skill (see botSkillProb/DIFFICULTY_TABLE): a sharp
// Conspirator on Hard/Impossible plays out-of-character often when it
// costs little; a careless one on Easy rarely bothers, whether or not
// they happened to roll as a "sleeper" archetype at deal time (sleepers
// just start with a higher baseline appetite for it).
function conspiratorPlaysCover(bot){
  if(S.tutorialMode) return false; // tutorial: bots never play out-of-character, see beginReveal
  if(inCaution()) return false;
  if(imProgress() >= RUSH_IM_PROGRESS) return false;   // rushing the win beats staying hidden
  if(S.rp >= EMERGENCY_RP) return false;               // Senate one Decree from winning — cover no longer matters
  var exposedCount = aliveExposers(bot).length;
  if(exposedCount>0 && Math.random() < (SLEEPER_LATE_DEFECT_CHANCE + SLEEPER_EXPOSED_DEFECT_BONUS*exposedCount)) return false;
  if(averagePublicSuspicion(bot) >= SLEEPER_COVER_THRESHOLD) return false;
  if(Math.random() < SLEEPER_LATE_DEFECT_CHANCE) return false;
  var baseChance = bot.sleeper ? SLEEPER_BASE_COVER_CHANCE : NON_SLEEPER_BASE_COVER_CHANCE;
  return Math.random() < baseChance * botSkillProb(bot);
}

function getEffectiveSuspicion(observer, targetId){
  var intel = observer.intel[targetId];
  if(intel==='enemy') return 96;
  if(intel==='loyal') return 4;
  if(observer.suspicion[targetId]===undefined) return SUSPICION_START;
  return observer.suspicion[targetId];
}

// Whoever `bot` currently suspects most, among the living (excluding
// themselves) — used only for flavor text (naming a suspect while
// declining to proscribe them), never to drive an actual decision.
function topSuspectFor(bot){
  var candidates = alivePlayers().filter(function(p){ return p.id!==bot.id; });
  if(!candidates.length) return null;
  var scored = candidates.map(function(p){ return {p:p, s:getEffectiveSuspicion(bot,p.id)}; })
    .sort(function(a,b){ return b.s-a.s; });
  return scored[0].p;
}

function clamp100(v){ return Math.max(0, Math.min(100, v)); }

// Called once per real (non-Chaos) legislative session. rpBefore/imBefore
// are the enacted counts BEFORE this round's card, i.e. exactly what the
// public Discarded/Remaining counters implied a moment before this draw.
//
// This models the actual two-stage handoff, not just the final card:
//   - Princeps drew 3 cards and discarded 1 — their forcedness is "what's
//     the chance all 3 of MY draws were this type, so I never had a choice
//     to make at all."
//   - Consul only ever SAW the 2 cards Princeps handed them — their
//     forcedness is "what's the chance the 2 cards I actually received
//     were both this type," which is a materially different (generally
//     higher) probability than the Princeps' 3-card figure. A Consul who
//     enacts Imperium off a genuinely mixed hand is far more telling than
//     a Princeps who merely drew a bad set of 3.
function updatePublicSuspicion(princepsId, consulId, enacted, rpBefore, imBefore, handWasMixed){
  var rpUnseen = 7 - rpBefore, imUnseen = 14 - imBefore;
  var totalUnseen = rpUnseen + imUnseen;
  var consulDelta, princepsDelta, worsens;
  if(enacted==='IM'){
    var pConsulForced = probAllKOfType(imUnseen, totalUnseen, 2); // both handed cards were IM
    var pPrincepsForced = probAllKOfType(imUnseen, totalUnseen, 3); // all 3 drawn were IM
    consulDelta = BASE_IM_SUSPICION * Math.max(MIN_FORCED_FACTOR, 1 - pConsulForced);
    princepsDelta = BASE_IM_SUSPICION * PRINCEPS_WEIGHT * Math.max(MIN_FORCED_FACTOR, 1 - pPrincepsForced);
    worsens = true;
  } else {
    var pConsulForcedRP = probAllKOfType(rpUnseen, totalUnseen, 2);
    var pPrincepsForcedRP = probAllKOfType(rpUnseen, totalUnseen, 3);
    consulDelta = BASE_RP_TRUST * Math.max(MIN_FORCED_FACTOR, 1 - pConsulForcedRP);
    princepsDelta = BASE_RP_TRUST * PRINCEPS_WEIGHT * Math.max(MIN_FORCED_FACTOR, 1 - pPrincepsForcedRP);
    worsens = false;
  }
  var sign = worsens ? 1 : -1;
  S.players.forEach(function(observer){
    if(observer.id!==consulId){
      var cur = observer.suspicion[consulId]===undefined ? SUSPICION_START : observer.suspicion[consulId];
      observer.suspicion[consulId] = clamp100(cur + sign*consulDelta);
    }
    if(observer.id!==princepsId){
      var cur2 = observer.suspicion[princepsId]===undefined ? SUSPICION_START : observer.suspicion[princepsId];
      observer.suspicion[princepsId] = clamp100(cur2 + sign*princepsDelta);
    }
    observer.observedTerms[princepsId] = (observer.observedTerms[princepsId]||0) + 1;
    observer.observedTerms[consulId] = (observer.observedTerms[consulId]||0) + 1;
  });
  // The Princeps personally handed the Consul these exact two cards — so if
  // that hand genuinely held one of each type, and the Consul still chose
  // to enact Imperium, that's not a probability to the Princeps, it's
  // ground truth. No Senate-aligned player ever passes up an available Res
  // Publica Decree (see botEnactChoice/botVoteChoice's mirror logic), so a
  // free choice for Imperium proves the Consul serves the conspiracy — the
  // Princeps now knows this exactly as if they'd personally Investigated
  // them, which is exactly how it's recorded here. Restricted to standard
  // games (5-10p, !smallGame()) — same precedent as conspiratorTeammates():
  // in 2-4p nobody is handed extra certainty for free, everyone still has
  // to feel their way, and a full-certainty reveal in a 2-player game (with
  // only one possible other role) is disproportionately decisive.
  if(enacted==='IM' && handWasMixed && !smallGame()){
    var princeps = byId(princepsId);
    var consul = byId(consulId);
    if(princeps && consul) markConfirmedEnemy(princeps, consul);
  }
}

// Candidates a bot considers "still worth testing" by giving them power —
// ambiguous suspicion AND a small sample size, so the next legislative
// outcome actually teaches us something. Confirmed players are excluded —
// there is nothing left to learn about them. Once the game reaches caution
// mode (see inCaution), nobody gets tested any more, on EITHER side — a bad
// guess this late can hand over the win outright, so bots fall straight
// through to their safe default instead.
function testCandidates(bot, pool){
  if(inCaution()) return [];
  return pool.filter(function(p){
    if(bot.intel[p.id]==='loyal' || bot.intel[p.id]==='enemy') return false;
    var s = getEffectiveSuspicion(bot, p.id);
    var seen = bot.observedTerms[p.id] || 0;
    return s>=TEST_GRAY_LOW && s<=TEST_GRAY_HIGH && seen<=TEST_MAX_SAMPLE;
  });
}

function botChooseNominee(bot){
  var elig = eligibleConsuls();
  if(!elig.length) return null;
  if(!smartRoll(bot)){
    // Unskilled still isn't RANDOM against their own side — a Conspirator
    // who fails the skill roll just skips the suspicion-reading and testing
    // logic below, but still backs a known ally when they have one. Senate
    // has no equivalent team signal for "who to nominate", so it really is
    // an even pick among the eligible for them.
    if(bot.team==='conspiracy'){
      var naiveAllies = knownAllies(bot);
      var naiveAllyChoices = elig.filter(function(p){ return naiveAllies.indexOf(p.id)!==-1; });
      if(naiveAllyChoices.length) return choose(naiveAllyChoices).id;
    }
    return choose(elig).id;
  }
  if(bot.team==='conspiracy'){
    var allies = knownAllies(bot);
    var allyChoices = elig.filter(function(p){ return allies.indexOf(p.id)!==-1; });
    if(allyChoices.length) return choose(allyChoices).id;
  }
  // Test an ambiguous, under-observed player to learn more about them —
  // most of the time, not always, so play doesn't become fully predictable.
  var testPool = testCandidates(bot, elig);
  if(testPool.length && Math.random()<TEST_PROBABILITY) return choose(testPool).id;
  if(bot.team==='senate'){
    // Prefer whoever currently looks safest; among the least-suspicious,
    // pick at random so it isn't always the single lowest score.
    var minS = Math.min.apply(null, elig.map(function(p){ return getEffectiveSuspicion(bot,p.id); }));
    var safest = elig.filter(function(p){ return getEffectiveSuspicion(bot,p.id) <= minS+8; });
    return choose(safest).id;
  }
  return choose(elig).id;
}
function botVoteChoice(bot, nomineeId){
  if(!smartRoll(bot)){
    // A Conspirator backing almost every government isn't a strategic read —
    // it's the team's baseline instinct, free of any suspicion math. Losing
    // the skill roll shouldn't erase that: a flat coin-flip would make a
    // careless Conspirator vote Nay on a total stranger just as often as a
    // sharp one votes Nay on someone they've actually got reason to doubt —
    // which reads exactly like a meaningful "I secretly know this person
    // isn't my ally" tell, especially early on before there's any real
    // public information to blend into. Keep the team-appropriate default,
    // just without the strategic reasoning behind it.
    // Same idea for the Senate: without any suspicion-reading, a real voter
    // still defaults to basic civic trust rather than a coin flip — Nay
    // without a reason to distrust anyone reads as arbitrary obstruction,
    // which is exactly the "plays against their own side" look this whole
    // change is meant to avoid.
    if(bot.team==='conspiracy') return Math.random()<0.90;
    return Math.random()<NAIVE_SENATE_AYE_PROBABILITY;
  }
  var nomineeSuspicion = getEffectiveSuspicion(bot, nomineeId);
  var princepsSuspicion = getEffectiveSuspicion(bot, currentPrinceps().id);
  var threat = (nomineeSuspicion + princepsSuspicion) / 2;
  if(bot.team==='conspiracy'){
    // Sleepers protect their cover first — an unexplained Nay against an
    // obviously trustworthy pairing is itself a tell (see the vote-trust
    // signal below), which defeats the whole point of playing it safe.
    if(conspiratorPlaysCover(bot)) return true;
    // Most Conspirators still back every government unconditionally,
    // whatever the pairing looks like — voting Nay normally only slows down
    // their OWN path to the Imperium threshold. But late in a close game,
    // rubber-stamping an obviously safe-looking Princeps/Consul pair just
    // hands the Senate another shot at Res Publica. So once the Senate is
    // within reach of its win (CONSPIRACY_OBSTRUCTION_RP_PROGRESS) and this
    // particular pairing looks safe enough to be worth blocking, a probable
    // minority starts obstructing instead — never the default, always a
    // probability, exactly the exception rather than the rule.
    if(!S.tutorialMode && rpProgress() >= CONSPIRACY_OBSTRUCTION_RP_PROGRESS && threat <= CONSPIRACY_OBSTRUCTION_TRUST_THRESHOLD){
      if(Math.random() < CONSPIRACY_OBSTRUCTION_PROBABILITY) return false;
    }
    return true;
  }
  // Once caution mode is active (see inCaution), electing the Imperator as
  // Consul is an instant loss for the Senate in EVERY game size — and a
  // suspicious Princeps handing cards to a suspicious Consul is exactly the
  // combination that makes that possible. So the Senate judges the pairing
  // together, not just the nominee alone, and tightens its nerve (a lower
  // bar for voting Nay) once that danger window opens. The bar drops further
  // still in 7-10p games, where the Conspiracy's guaranteed-aye voting bloc
  // is a larger share of the table and takes fewer wavering Senate votes to
  // slip a risky pairing through.
  var threshold = SENATE_NAY_THRESHOLD;
  if(inCaution()) threshold = (S.count>=7) ? SENATE_NAY_THRESHOLD_CAUTION_LARGE : SENATE_NAY_THRESHOLD_CAUTION;
  if(threat >= threshold) return false;
  return true;
}

// A vote is public, and how someone votes relative to how risky the pairing
// actually looks is itself a (noisy) tell — a Conspirator backs almost every
// government unconditionally, so an observer who watches someone wave
// through an obviously risky-looking pairing gains a little legitimate
// evidence they might be exactly that; blocking an obviously safe-looking
// one is the mirror tell (see the new late-game obstruction behavior above).
// Each observer judges this from their OWN private suspicion of the nominee
// and Princeps — nothing here reads anyone's hidden role or intel directly.
function updateVoteTrust(nomineeId, princepsId){
  alivePlayers().forEach(function(observer){
    alivePlayers().forEach(function(voter){
      if(voter.id===observer.id) return;
      var voted = S.votes[voter.id];
      if(voted===undefined) return;
      var threat = (getEffectiveSuspicion(observer, nomineeId) + getEffectiveSuspicion(observer, princepsId)) / 2;
      var cur = observer.suspicion[voter.id]===undefined ? SUSPICION_START : observer.suspicion[voter.id];
      if(voted && threat >= VOTE_TRUST_RISKY){
        observer.suspicion[voter.id] = clamp100(cur + VOTE_TRUST_SHIFT);
      } else if(!voted && threat <= VOTE_TRUST_SAFE){
        observer.suspicion[voter.id] = clamp100(cur + VOTE_TRUST_SHIFT);
      }
    });
  });
}

// Votes are cast in full view of the table, so WHO voted Nay on a given
// nominee is public record — recorded here, objectively, regardless of
// anyone's private opinion at the time.
function recordNayVotes(nomineeId){
  var nominee = byId(nomineeId);
  alivePlayers().forEach(function(voter){
    if(S.votes[voter.id]===false && nominee.nayVotesReceived.indexOf(voter.id)===-1){
      nominee.nayVotesReceived.push(voter.id);
    }
  });
}

// Retroactive vindication: the moment `observer` privately confirms `target`
// is really an enemy (via an honest Investigate Loyalty), anyone who had
// EVER voted Nay on that target in the past looks a little more trustworthy
// to `observer` now — they were right to be wary, even though nobody could
// prove it at the time. This only updates `observer`'s own private suspicion
// — nobody else learns anything from it, since nobody else knows the result.
function applyVindication(observer, target){
  if(!target.nayVotesReceived || !target.nayVotesReceived.length) return;
  target.nayVotesReceived.forEach(function(voterId){
    if(voterId===observer.id) return;
    var cur = observer.suspicion[voterId]===undefined ? SUSPICION_START : observer.suspicion[voterId];
    observer.suspicion[voterId] = clamp100(cur - RETRO_VINDICATION_SHIFT);
  });
}

// Proscribing someone who looked suspicious is a public, decisive act —
// every other observer updates their trust in the Princeps who made the
// call, scaled by how suspicious THAT OBSERVER (privately) rated the
// target. Proscribing someone nobody suspected earns little; proscribing
// someone near-universally distrusted earns close to the full reward.
// This runs BEFORE the target is marked dead, but getEffectiveSuspicion
// doesn't care about alive/dead so the ordering doesn't matter.
function applyProscribeTrust(princeps, target){
  alivePlayers().forEach(function(observer){
    if(observer.id===princeps.id || observer.id===target.id) return;
    var targetSusp = getEffectiveSuspicion(observer, target.id);
    if(targetSusp <= SUSPICION_START) return; // only rewarded for removing someone who looked bad
    var shift = PROSCRIBE_TRUST_MAX_SHIFT * ((targetSusp - SUSPICION_START) / (100 - SUSPICION_START));
    var cur = observer.suspicion[princeps.id]===undefined ? SUSPICION_START : observer.suspicion[princeps.id];
    observer.suspicion[princeps.id] = clamp100(cur - shift);
  });
}

// Name-derived (never role-derived) per-player color, so the human player
// gets a memorable visual anchor per senator without any side-channel leak
// of hidden roles. Palette is intentionally disjoint from the role-tinted
// --gold/--tyrian/--republic/--imperium tokens used elsewhere in the UI.
var AVATAR_PALETTE = ['#14b8a6','#0d9488','#2dd4bf','#06b6d4','#0ea5e9','#0284c7','#3b82f6','#2563eb','#6366f1','#4f46e5','#8b5cf6','#7c3aed','#a855f7','#9333ea','#c026d3','#d946ef'];
function playerColor(name){
  var str = name || '';
  var hash = 0;
  for(var i=0;i<str.length;i++){
    hash = ((hash<<5)-hash+str.charCodeAt(i))|0;
  }
  return AVATAR_PALETTE[Math.abs(hash) % AVATAR_PALETTE.length];
}
function initialsOf(name){
  var initials = (name||'').split(/\s+/).filter(function(w){ return w.length>0; }).slice(0,2).map(function(w){ return w.charAt(0).toUpperCase(); }).join('');
  return initials || '?';
}
function avatarHtml(player, size){
  var name = (player && player.name) || '';
  var sz = size || 28;
  var initials = initialsOf(name);
  var bg = name ? playerColor(name) : '#64748b';
  return '<span class="avatar" style="width:'+sz+'px;height:'+sz+'px;min-width:'+sz+'px;background:'+bg+';font-size:'+Math.max(10, Math.round(sz*0.4))+'px">'+initials+'</span>';
}

// Compact Aye/Nay control mirrored in the top corner of the status bar,
// next to the card-counter track, so the human doesn't have to scroll down
// to the full vote list to see or change their own vote. Both controls
// write to the exact same S.votes state via castVote(), so they always
// agree with each other.
function topVoteHtml(){
  var hp = humanPlayer();
  if(S.phase !== 'vote' || !hp || !hp.alive) return '';
  var nominee = S.nomineeId!=null ? byId(S.nomineeId) : null;
  var val = S.votes[hp.id];
  var ayeClass = val === true ? ' chosen-aye' : '';
  var nayClass = val === false ? ' chosen-nay' : '';
  return '<div class="topvote">' +
    '<span class="topvote-label">Vote'+(nominee?': '+nominee.name:'')+'</span>' +
    '<button class="topvote-btn'+ayeClass+'" data-top-vote-val="1">Aye</button>' +
    '<button class="topvote-btn'+nayClass+'" data-top-vote-val="0">Nay</button>' +
  '</div>';
}

// Which card to keep/discard is basic team loyalty, not "strategy" — so
// unlike nominate/vote/investigate targeting, this is NOT gated by
// smartRoll at all: every bot, skilled or not, plays the card that helps
// its own side. Skill only decides whether a Conspirator plays COVER
// (deliberately picking the Senate-favored card to look innocent) — a
// genuinely strategic move — via conspiratorPlaysCover. Without this, an
// honest Senator could randomly discard Res Publica and keep two Imperium
// cards on a failed skill roll, which looks exactly like betrayal to a
// player watching, even though nothing about the situation actually calls
// for randomness here.
function botDiscardChoice(bot, three){
  if(bot.team==='senate') { var i=three.indexOf('IM'); return i!==-1?i:0; }
  // Skill is already baked into conspiratorPlaysCover's own probability
  // (see botSkillProb inside it) — no separate smartRoll gate needed here.
  if(conspiratorPlaysCover(bot)){ var i2=three.indexOf('IM'); return i2!==-1?i2:0; }
  var j=three.indexOf('RP'); return j!==-1?j:0;
}
function botEnactChoice(bot, two){
  if(bot.team==='senate') { var i=two.indexOf('RP'); return i!==-1?i:0; }
  if(conspiratorPlaysCover(bot)){ var i2=two.indexOf('RP'); return i2!==-1?i2:0; }
  var j=two.indexOf('IM'); return j!==-1?j:0;
}
// True when, if the veto on this exact two-card hand were refused, the
// enactment botEnactChoice would then force on the Consul goes against
// `bot`'s ownteam. This is the one question both sides of a veto
// decision are really asking — "does refusing this hand force through a
// decree I don't want?" — so it's shared by whoever is the Consul
// deciding whether to PROPOSE a veto and whoever is the Princeps deciding
// whether to ACCEPT one: a Senate player (or a covering Conspirator, who
// by this point in caution/EMERGENCY_RP territory is no longer covering
// anyway — see conspiratorPlaysCover) is only ever forced into something
// unwanted by an IM+IM hand; an uncovered Conspirator or the Imperator is
// only ever forced into something unwanted by an RP+RP hand — and that
// case is exactly "refusing to place the last Res Publica Decree" when
// S.rp is already at 4: enacting it ends the game for the Senate on the
// spot, so the veto is Conspiracy's only way out of a hand that would
// otherwise hand the Senate the win.
function forcedEnactmentHurtsTeam(bot, two){
  var hasRP = two.indexOf('RP')!==-1, hasIM = two.indexOf('IM')!==-1;
  if(bot.team==='senate') return !hasRP;  // forced into IM+IM
  return !hasIM;                          // Conspiracy/Imperator forced into RP+RP
}
function botVetoChoice(bot, two, proposerId){
  // Whether refusing this veto forces through a decree that hurts your own
  // team is, again, just reading your own hand — not strategy — so it's
  // never gated by skill. Skill only gates the one genuinely strategic
  // read: extending extra trust to a KNOWN ally's veto request even when
  // it wasn't strictly forced (see below).
  var proposer = proposerId!=null ? byId(proposerId) : null;
  if(!smartRoll(bot)) return forcedEnactmentHurtsTeam(bot, two);
