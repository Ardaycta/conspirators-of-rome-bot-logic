  // A known ally proposing a veto on a hand that wasn't actually forced is
  // a cover play (see consulValuesCover/CONSUL_MIXED_HAND_VETO_PROBABILITY
  // in princepsDiscard) — accept it to protect their identity, even though
  // refusing would otherwise hand the Conspiracy a free Imperium Decree.
  // Only fires when `bot` genuinely KNOWS the proposer is on their side —
  // an unconfirmed ally's odd veto request just looks like an odd veto
  // request, evaluated normally below.
  if(proposer && bot.team!=='senate' && proposer.team!=='senate' &&
     knownAllies(bot).indexOf(proposer.id)!==-1 && !forcedEnactmentHurtsTeam(proposer, two)){
    return true;
  }
  return forcedEnactmentHurtsTeam(bot, two);
}
function botInvestigateChoice(bot){
  if(!smartRoll(bot)){
    var poolN = alivePlayers().filter(function(p){ return p.id!==bot.id; });
    return choose(poolN).id;
  }
  var allies = knownAllies(bot);
  var base = alivePlayers().filter(function(p){ return p.id!==bot.id && allies.indexOf(p.id)===-1 && !(p.id in bot.intel); });
  if(!base.length) base = alivePlayers().filter(function(p){ return p.id!==bot.id && allies.indexOf(p.id)===-1; });
  if(!base.length) base = alivePlayers().filter(function(p){ return p.id!==bot.id; });
  // Spend the investigation where it teaches the most: the player closest
  // to 50/50 suspicion, not one we're already fairly sure about.
  var best = base.slice().sort(function(a,b){
    return Math.abs(getEffectiveSuspicion(bot,a.id)-50) - Math.abs(getEffectiveSuspicion(bot,b.id)-50);
  });
  var closest = Math.abs(getEffectiveSuspicion(bot,best[0].id)-50);
  var tied = best.filter(function(p){ return Math.abs(getEffectiveSuspicion(bot,p.id)-50) <= closest+5; });
  return choose(tied).id;
}
function botSpecialChoice(bot){
  var pool = alivePlayers().filter(function(p){ return p.id!==bot.id; });
  if(!smartRoll(bot)) return choose(pool).id;
  var allies = knownAllies(bot);
  var known = pool.filter(function(p){ return allies.indexOf(p.id)!==-1; });
  if(known.length) return choose(known).id;
  var testPool = testCandidates(bot, pool);
  if(testPool.length && Math.random()<TEST_PROBABILITY) return choose(testPool).id;
  return choose(pool).id;
}
function botProscribeChoice(bot){
  // Bots only avoid proscribing a teammate they've actually confirmed —
  // in a small Senate that means they too can misfire and betray their own side.
  var allies = knownAllies(bot);
  var pool = alivePlayers().filter(function(p){ return p.id!==bot.id && allies.indexOf(p.id)===-1; });
  if(!pool.length) pool = alivePlayers().filter(function(p){ return p.id!==bot.id; });
  if(!smartRoll(bot)) return choose(pool).id;

  // Silence a living witness first: someone who personally confirmed your
  // identity via an honest Investigate Loyalty is a far bigger threat than
  // an unconfirmed suspect, whatever the suspicion math says.
  var witnesses = pool.filter(function(p){ return bot.exposedTo.indexOf(p.id)!==-1; });
  if(witnesses.length) return choose(witnesses).id;

  var enemies = pool.filter(function(p){ return bot.intel[p.id]==='enemy'; });
  if(enemies.length) return choose(enemies).id;

  if(bot.team==='conspiracy'){
    // Suspicion reads as "how Conspiracy-like does this player look" — so a
    // Conspirator's best unconfirmed target is the OPPOSITE end: whoever
    // looks most trustworthy/Senator-like is most likely a real, reliable
    // Senate figure. This doubles as the "strategic sabotage" pick once the
    // Senate is dangerously close to winning (S.rp>=EMERGENCY_RP): removing
    // a trusted, frequently-elected voice rather than hunting for a hidden
    // enemy that may not even be findable in time.
    var minS = Math.min.apply(null, pool.map(function(p){ return getEffectiveSuspicion(bot,p.id); }));
    // Friendly-fire hedge: in a small game nobody is shown their allies at
    // reveal, so an unconfirmed real teammate playing well looks EXACTLY as
    // trustworthy as a genuine Senator — there's no legitimate way to tell
    // them apart from suspicion alone. Locking onto the single most-trusted
    // face would then be just as likely to execute your own side as an
    // opponent. With no confirmed ally to rule anyone out yet, widen the
    // pool the pick is drawn from so the risk is spread rather than certain.
    var band = (smallGame() && knownAllies(bot).length===0) ? PROSCRIBE_TIE_BAND+FRIENDLY_FIRE_HEDGE_BAND : PROSCRIBE_TIE_BAND;
    var trusted = pool.filter(function(p){ return getEffectiveSuspicion(bot,p.id) <= minS+band; });
    return choose(narrowByNayVotes(trusted, true)).id;
  }

  // Senate: no confirmed enemy on hand — proscribe whoever looks most
  // suspicious. Once the Conspiracy is dangerously close to winning
  // (within URGENT_IM_MARGIN Decrees), narrow the tie band so the pick
  // commits to the single best guess instead of spreading risk across a
  // wider "close enough" group — a strategic, urgency-driven pick.
  // Urgency applies in small games too now — a 2-4p Senate one Decree from
  // losing to the Imperium track needs the same tightened, commit-to-one-guess
  // proscribe as the standard game, just measured against its own (lower,
  // separately tunable) threshold and margin.
  var urgent = smallGame() ? (imWinThreshold()-S.im) <= URGENT_IM_MARGIN_SMALL : (imWinThreshold()-S.im) <= URGENT_IM_MARGIN;
  var tieBand = urgent ? URGENT_PROSCRIBE_TIE_BAND : PROSCRIBE_TIE_BAND;
  var maxS = Math.max.apply(null, pool.map(function(p){ return getEffectiveSuspicion(bot,p.id); }));
  var top = pool.filter(function(p){ return getEffectiveSuspicion(bot,p.id) >= maxS-tieBand; });
  return choose(narrowByNayVotes(top, false)).id;
}

// Small strategic refinement: when several proscribe candidates are tied on
// suspicion, a sharp player also weighs a real public fact nothing above
// uses yet — how many OTHER players have ever voted Nay on this person as a
// Consul nominee (nayVotesReceived, cast in full view, not hidden info).
// The Senate narrows toward whoever carries the MOST accumulated Nay votes
// (corroborating suspicion from multiple people, not just this one
// observer's own read); the Conspiracy narrows its "safest, most trusted"
// pick toward whoever carries the FEWEST (a spotless public record is the
// strongest sign of a genuine, reliable Senate figure). Never the sole
// factor — just a tiebreak among an already-tied group.
function narrowByNayVotes(candidates, wantFewest){
  if(candidates.length<=1) return candidates;
  var counts = candidates.map(function(p){ return (p.nayVotesReceived||[]).length; });
  var target = wantFewest ? Math.min.apply(null, counts) : Math.max.apply(null, counts);
  var narrowed = candidates.filter(function(p){ return (p.nayVotesReceived||[]).length === target; });
  return narrowed.length ? narrowed : candidates;
}

function speedDelay(){
  if(S.speed==='slow') return 4000;
  if(S.speed==='fast') return 2000;
  return 700; // 'off' — original pacing, unchanged
}

function botWait(label, fn, delay){
  S.thinkingLabel = label;
  S.phase = 'bot_wait';
  render();
  setTimeout(fn, delay||speedDelay());
}

// Auto-advance for screens that only ever show a "Continue" button — never
// for a screen where the human has to actually choose something. At 'off'
// (the original behavior) nothing here fires; the button always still works
// as a manual skip-ahead even while a timer is running.
var autoContinueTimer = null;
function clearAutoContinue(){
  if(autoContinueTimer){ clearTimeout(autoContinueTimer); autoContinueTimer = null; }
}
function fireContinue(fn){
  clearAutoContinue();
  fn();
}
function goToGameOver(){ S.phase = 'gameover'; render(); }
function autoContinueHandler(){
  switch(S.phase){
    case 'vote_result': return S.winner ? goToGameOver : afterVoteResultContinue;
    case 'chaos_result': return S.winner ? goToGameOver : afterChaosContinue;
    case 'decree_result': return S.winner ? goToGameOver : afterDecreeContinue;
    case 'power_intro': return beginPower;
    // Deliberately NOT auto-continued: this is the one screen where the
    // human picks a dialogue claim (or silence) about what they just
    // learned — the pace timer must never fire it out from under a
    // still-undecided choice. See investigateDoneBtn in wireEvents.
    case 'power_peek_reveal': return finishPeek;
    case 'power_proscribe_reveal': return S.winner ? goToGameOver : finishProscribe;
    default: return null;
  }
}

/* ---------- Government ---------- */
function eligibleConsuls(){
  var alive = alivePlayers();
  var n = alive.length;
  return alive.filter(function(p){
    if(p.id === S.players[S.princepsIndex].id) return false;
    if(n<=4) return true; // small Senates: term limits waived so there's always a real choice
    if(p.id === S.previousConsulId) return false;
    if(n>5 && p.id === S.previousPrincepsId) return false;
    return true;
  });
}

function currentPrinceps(){
  return S.players[S.princepsIndex];
}

function advancePrinceps(){
  var n = S.players.length;
  var idx = S.princepsIndex;
  do{
    idx = (idx+1) % n;
  } while(!S.players[idx].alive);
  S.princepsIndex = idx;
  tickPublicNotices();
}

function beginNomination(){
  S.consulId = null;
  S.nomineeId = null;
  if(isHuman(currentPrinceps())){
    S.phase = 'nominate';
    render();
  } else {
    botWait(currentPrinceps().name+' is deliberating a nomination for Consul…', function(){
      var id = botChooseNominee(currentPrinceps());
      S.nomineeId = id;
      var nClaim = botNominateClaim(currentPrinceps());
      botSpeak(currentPrinceps(), 'nominate', nClaim, byId(id).name);
      confirmNomination();
    });
  }
}

function confirmNomination(){
  if(S.nomineeId==null) return;
  pushLog(currentPrinceps().name+' nominates '+byId(S.nomineeId).name+' for Consul.');
  S.votes = {};
  alivePlayers().forEach(function(p){
    if(!isHuman(p)){
      var isAye = botVoteChoice(p, S.nomineeId);
      S.votes[p.id] = isAye;
      var vClaim = botVoteClaim(p, isAye);
      botSpeak(p, 'vote', vClaim, byId(S.nomineeId).name);
    }
  });
  // Bot votes are shown openly the moment they're cast (see renderVote), so
  // there's nothing left to "reveal" — if the human is dead or has already
  // voted, go straight to the result instead of waiting on an extra tap.
  if(allVoted()){
    resolveVote();
  } else {
    S.phase = 'vote';
    render();
  }
}

function castVote(pid, val, claimId){
  S.votes[pid] = val;
  var voter = byId(pid);
  if(voter && isHuman(voter)) botSpeak(voter, 'vote', claimId, byId(S.nomineeId) ? byId(S.nomineeId).name : null);
  if(allVoted()){
    resolveVote();
  } else {
    render();
  }
}

function allVoted(){
  var h = humanPlayer();
  if(!h || !h.alive) return true;
  return S.votes.hasOwnProperty(h.id);
}

function tallyVotes(){
  var ayes=0, nays=0;
  alivePlayers().forEach(function(p){ if(S.votes[p.id]) ayes++; else nays++; });
  return {ayes:ayes,nays:nays};
}

function resolveVote(){
  updateVoteTrust(S.nomineeId, currentPrinceps().id);
  recordNayVotes(S.nomineeId);
  var t = tallyVotes();
  var passed = t.ayes > t.nays;
  S.phase = 'vote_result';
  S.voteResultPassed = passed;
  if(passed){
    var nominee = byId(S.nomineeId);
    pushLog('Consul '+nominee.name+' confirmed '+t.ayes+'-'+t.nays+'.');
    if(!smallGame() && S.im>=3 && nominee.role==='imperator'){
      S.winner='conspirators';
      S.winReason = nominee.name+' — secretly the Imperator — was confirmed Consul after three Imperium Decrees. Rome falls.';
      S.phase='gameover';
    }
  } else {
    pushLog('The nomination of '+byId(S.nomineeId).name+' failed '+t.ayes+'-'+t.nays+'.');
    S.electionTracker++;
  }
  render();
}

function afterVoteResultContinue(){
  if(S.winner){ render(); return; }
  if(!S.voteResultPassed){
    if(S.electionTracker>=3){
      chaosEnact();
      return;
    }
    advancePrinceps();
    beginNomination();
    return;
  }
  S.previousConsulId = S.nomineeId;
  S.previousPrincepsId = currentPrinceps().id;
  S.consulId = S.nomineeId;
  S.electionTracker = 0;
  startLegislative();
}

function chaosEnact(){
  ensureDeck(1);
  var card = S.deck.shift();
  S.chaosCard = card;
  applyEnactment(card, true);
  if(S.winner){ return; } // applyEnactment already moved to gameover and rendered — don't clobber it
  S.electionTracker = 0;
  S.previousConsulId = null;
  S.previousPrincepsId = null;
  S.phase = 'chaos_result';
  render();
}

function afterChaosContinue(){
  if(S.winner){ render(); return; }
  advancePrinceps();
  beginNomination();
}

/* ---------- Legislative session ---------- */
function ensureDeck(minNeeded){
  if(S.deck.length < minNeeded){
    S.deck = S.deck.concat(shuffle(S.discardPile));
    S.discardPile = [];
    pushLog('The decree chest is reshuffled.');
  }
}

function startLegislative(){
  ensureDeck(3);
  S.drawnThree = [S.deck.shift(), S.deck.shift(), S.deck.shift()];
  S.discardSelection = [];
  if(isHuman(currentPrinceps())){
    S.phase = 'legis_princeps_draw';
    render();
  } else {
    botWait(currentPrinceps().name+' reviews three decrees…', function(){
      var three = S.drawnThree;
      var idx = botDiscardChoice(currentPrinceps(), three);
      var claimId = botDiscardClaim(currentPrinceps(), three);
      princepsDiscard(idx, claimId);
    });
  }
}

function princepsDiscard(idx, claimId){
  var princeps = currentPrinceps();
  botSpeak(princeps, 'discard', claimId);
  var card = S.drawnThree.splice(idx,1)[0];
  S.discardPile.push(card);
  S.handedTwo = S.drawnThree.slice();
  S.enactSelection = null;
  S.vetoRequested = false;
  var consul = byId(S.consulId);
  if(isHuman(consul)){
    S.phase = 'legis_consul_draw';
    render();
  } else {
    botWait(consul.name+' weighs the two decrees…', function(){
      var two = S.handedTwo;
      var handIsMixed = two[0]!==two[1];
      var consulSkilled = smartRoll(consul);
      // Noticing a hand that mechanically hurts your own team is just
      // reading your own two cards, not strategy — every Consul catches
      // that regardless of skill. Skill only gates the genuinely strategic
      // "cover" veto (see consulValuesCover) — there's no more flat-rate
      // random veto request for an unskilled Consul; a bot with nothing
      // going on in its hand simply has no reason to ask for one.
      var trulyForced = forcedEnactmentHurtsTeam(consul, two);
      var wantsCoverVeto = consulSkilled && !trulyForced && consul.team!=='senate' && handIsMixed &&
        consulValuesCover(consul) && Math.random()<CONSUL_MIXED_HAND_VETO_PROBABILITY;
      if(S.im>=vetoThreshold() && (trulyForced || wantsCoverVeto)){
        var voClaim = botVetoProposeClaim(consul, trulyForced);
        consulRequestVeto(voClaim);
        return;
      }
      var idx2 = botEnactChoice(consul, two);
      var enClaim = botEnactClaim(consul, two, two[idx2], handIsMixed);
      consulEnact(idx2, enClaim);
    });
  }
}

function consulRequestVeto(claimId){
  S.vetoRequested = true;
  pushLog(byId(S.consulId).name+' proposes a joint veto.');
  botSpeak(byId(S.consulId), 'veto_propose', claimId);
  if(isHuman(currentPrinceps())){
    S.phase = 'veto_princeps_decide';
    render();
  } else {
    botWait(currentPrinceps().name+' considers the Consul\'s veto…', function(){
      var accept = botVetoChoice(currentPrinceps(), S.handedTwo, S.consulId);
      var reClaim = accept ? botVetoAcceptClaim(currentPrinceps()) : botVetoRefuseClaim(currentPrinceps());
      princepsAcceptVeto(accept, reClaim);
    });
  }
}

function princepsAcceptVeto(accept, claimId){
  botSpeak(currentPrinceps(), accept ? 'veto_accept' : 'veto_refuse', claimId);
  if(accept){
    S.handedTwo.forEach(function(c){S.discardPile.push(c);});
    S.handedTwo = [];
    pushLog('Princeps and Consul jointly veto the decrees. None enacted.');
    // Agreeing to veto already says what happens — no separate result
    // screen needed, straight on to the next nomination.
    afterVetoContinue();
  } else {
    pushLog('Princeps refuses the veto. The Consul must choose.');
    var consul = byId(S.consulId);
    if(isHuman(consul)){
      S.phase = 'legis_consul_draw';
      render();
    } else {
      // A bot Consul proposed the veto and got refused — nothing else was
      // going to re-trigger their enact decision (the only other place that
      // fires it is princepsDiscard's own bot branch, which we've already
      // passed), so without this the game would sit on legis_consul_draw
      // forever showing a human-only screen with no human to click it.
      S.phase = 'legis_consul_draw';
      botWait(consul.name+' must choose after all…', function(){
        var two = S.handedTwo;
        var handIsMixed = two[0]!==two[1];
        var idx2 = botEnactChoice(consul, two);
        var enClaim = botEnactClaim(consul, two, two[idx2], handIsMixed);
        consulEnact(idx2, enClaim);
      });
    }
  }
}

function afterVetoContinue(){
  advancePrinceps();
  beginNomination();
}

function consulEnact(idx, claimId){
  var enacted = S.handedTwo[idx];
  var discarded = S.handedTwo[1-idx];
  var handWasMixed = enacted !== discarded; // Consul had a genuine choice, not a forced hand
  botSpeak(byId(S.consulId), 'enact', claimId);
  S.discardPile.push(discarded);
  S.handedTwo = [];
  applyEnactment(enacted, false, handWasMixed);
}

function applyEnactment(card, isChaos, handWasMixed){
  if(!isChaos){
    updatePublicSuspicion(currentPrinceps().id, S.consulId, card, S.rp, S.im, handWasMixed);
  }
  if(card==='RP'){ S.rp++; } else { S.im++; }
  var imTotal = imWinThreshold();
  var princepsName = isChaos ? null : currentPrinceps().name;
  var consulName = isChaos ? null : byId(S.consulId).name;
  S.enactmentHistory.push({card:card, princepsName:princepsName, consulName:consulName, isChaos:!!isChaos});
  pushLog((isChaos?'Chaos enacts':'Enacted')+' a '+(card==='RP'?'Res Publica':'Imperium')+' Decree ('+(card==='RP'?S.rp+'/5':S.im+'/'+imTotal)+')'+(isChaos?'':' — Princeps '+princepsName+' &amp; Consul '+consulName)+'.');

  if(S.rp>=5){
    S.winner='senate';
    S.winReason='Five Res Publica Decrees have restored the Republic.';
    S.phase='gameover';
    render();
    return;
  }
  if(S.im>=imTotal){
    S.winner='conspirators';
    S.winReason=imTotal+' Imperium Decrees have dissolved the Senate.';
    S.phase='gameover';
    render();
    return;
  }

  if(!isChaos && card==='IM'){
    var tier = powerTier(S.count);
    var power = POWER_TABLE[tier][S.im];
    if(power){
      S.pendingPower = power;
      S.phase = 'power_intro';
      render();
      return;
    }
  }
  S.phase = isChaos ? 'chaos_result' : 'decree_result';
  render();
}

/* ---------- Powers ---------- */
function beginPower(){
  var princeps = currentPrinceps();
  if(S.pendingPower==='investigate'){
    if(isHuman(princeps)){
      S.investigateTargetId=null; S.investigateResult=null;
      S.phase='power_investigate_pick';
      render();
    } else {
      botWait(princeps.name+' opens an investigation…', function(){
        var targetId = botInvestigateChoice(princeps);
        var target = byId(targetId);
        var foundEnemy = target.team !== princeps.team;
        princeps.intel[targetId] = foundEnemy ? 'enemy' : 'loyal';
        if(foundEnemy) markConfirmedEnemy(princeps, target);
        target.investigated = true;
        S.investigateLog.push({investigatorName:princeps.name, targetName:target.name, result:(target.role==='senator'?'Loyal to the Republic':'Enemy of the Republic')});
        addPublicNotice(princeps.name+' investigated '+target.name+' (result kept private)');
        pushLog(princeps.name+' investigates '+target.name+', in full view of the Curia — the result stays private to them.');
        var claim = botInvestigateRevealClaim(princeps, foundEnemy);
        recordInvestigateClaim(princeps, target, claim.claimId, claim.claimedLoyal);
        S.pendingPower = null;
        S.phase = 'decree_result';
        render();
      });
    }
  } else if(S.pendingPower==='special_election'){
    if(isHuman(princeps)){
      S.specialElectionPicked=null;
      S.phase='power_special_pick';
      render();
    } else {
      botWait(princeps.name+' calls a Special Comitia…', function(){
        var id = botSpecialChoice(princeps);
        var sClaim = botSpecialElectionClaim(princeps);
        specialElectionPick(id, sClaim);
      });
    }
  } else if(S.pendingPower==='peek'){
    if(isHuman(princeps)){
      ensureDeck(3);
      S.peekCards = [S.deck[0], S.deck[1], S.deck[2]];
      S.phase='power_peek_reveal';
      render();
    } else {
      botWait(princeps.name+' foresees the path ahead…', function(){
        S.peekLog.push({name:princeps.name});
        pushLog(princeps.name+' foresees the next three decrees.');
        S.pendingPower = null;
        S.phase = 'decree_result';
        render();
      });
    }
  } else if(S.pendingPower==='proscribe'){
    if(isHuman(princeps)){
      S.proscribeTargetId=null;
      S.phase='power_proscribe_pick';
      render();
    } else {
      botWait(princeps.name+' names someone for proscription…', function(){
        var id = botProscribeChoice(princeps);
        var pClaim = botProscribeClaim(princeps);
        proscribePick(id, pClaim);
      });
    }
  }
}

function investigatePick(id){
  var target = byId(id);
  var princeps = currentPrinceps();
  S.investigateTargetId = id;
  S.investigateResult = (target.role==='senator') ? 'Loyal to the Republic' : 'Enemy of the Republic';
  target.investigated = true;
  var foundEnemy = target.team !== princeps.team;
  princeps.intel[id] = foundEnemy ? 'enemy' : 'loyal';
  if(foundEnemy) markConfirmedEnemy(princeps, target);
  S.phase = 'power_investigate_reveal';
  render();
}

function finishInvestigate(claimId){
  var princeps = currentPrinceps();
  var target = byId(S.investigateTargetId);
  S.investigateLog.push({investigatorName:princeps.name, targetName:target.name, result:S.investigateResult});
  addPublicNotice(princeps.name+' investigated '+target.name+' (result kept private)');
  pushLog(princeps.name+' investigates '+target.name+', in full view of the Curia — the result stays private to them.');
  var claimedLoyal = claimId==='ir_loyal' ? true : (claimId==='ir_enemy' ? false : null);
  recordInvestigateClaim(princeps, target, claimId, claimedLoyal);
  S.pendingPower = null;
  S.phase = 'decree_result';
  render();
}

// Shared by both the bot and human investigate-reveal paths: speaks the
// chosen claim into the log, then — if the claim actually asserted a
// loyalty verdict (not silence/private/inconclusive) — records it as a
// public vouch and immediately cross-checks it against every OTHER
// player's own personal intel on the same target. Anyone who already
// privately knows the truth catches a contradicting claim as an outright,
// certain lie (same certainty tier as a personal Investigate result).
function recordInvestigateClaim(investigator, target, claimId, claimedLoyal){
  botSpeak(investigator, 'investigate_reveal', claimId, target.name);
  if(claimedLoyal===null || claimedLoyal===undefined) return;
  if(!S.investigateVouches[target.id]) S.investigateVouches[target.id] = [];
  S.investigateVouches[target.id].push({investigatorId:investigator.id, claimedLoyal:claimedLoyal});
  S.players.forEach(function(observer){
    if(observer.id===investigator.id) return;
    var truth = observer.intel[target.id];
    if(truth===undefined) return;
    var truthIsLoyal = (truth==='loyal');
    if(truthIsLoyal !== claimedLoyal) markConfirmedEnemy(observer, investigator);
  });
}

function specialElectionPick(id, claimId){
  S.specialElectionPicked = id;
  botSpeak(currentPrinceps(), 'special_election', claimId, byId(id).name);
  pushLog(currentPrinceps().name+' calls a Special Comitia, naming '+byId(id).name+' to preside next.');
  S.pendingPower = null;
  S.phase = 'decree_result';
  S.specialElectionActive = true;
  render();
}

function finishPeek(){
  S.peekLog.push({name:currentPrinceps().name});
  pushLog(currentPrinceps().name+' foresees the next three decrees.');
  S.pendingPower = null;
  S.phase = 'decree_result';
  render();
}

function knowsAlly(player, targetId){
  return knownAllies(player).indexOf(targetId)!==-1;
}

function proscribePick(id, claimId){
  S.proscribeTargetId = id;
  var target = byId(id);
  var princeps = currentPrinceps();
  botSpeak(princeps, 'proscribe', claimId, target.name);
  if(smallGame() && isHuman(princeps) && knowsAlly(princeps, id)){
    // Betraying a known ally is a personal loss for the human player — but it
    // stays hidden until the final reveal, exactly like the rest of the table.
    S.betrayal = {playerId:princeps.id, targetName:target.name};
  }
  // Logged here, immediately — not in finishProscribe(), which the WINNING
  // proscribe (target is the Imperator) skips entirely by jumping straight
  // to "See final reveal." Logging it only in finishProscribe() meant the
  // single decisive action of the game was silently missing from the record.
  pushLog(princeps.name+' proscribes '+target.name+'.');
  applyProscribeTrust(princeps, target);
  target.alive = false;
  S.phase = 'power_proscribe_reveal';
  if(target.role==='imperator'){
    S.winner='senate';
    S.winReason = target.name+' — the hidden Imperator — has been proscribed. The conspiracy collapses.';
  } else {
    var survivors = alivePlayers();
    if(survivors.length===1){
      var last = survivors[0];
      S.winner = last.team==='senate' ? 'senate' : 'conspirators';
      S.winReason = last.name+' stands alone in the Curia — every other senator has been proscribed.';
    }
  }
  render();
}

function skipProscribe(claimId){
  var princeps = currentPrinceps();
  var topSuspect = topSuspectFor(princeps);
  botSpeak(princeps, 'proscribe_skip', claimId, topSuspect ? topSuspect.name : null);
  pushLog(princeps.name+' declines to proscribe anyone this term.');
  S.pendingPower = null;
  S.phase = 'decree_result';
  render();
}

function finishProscribe(){
  var target = byId(S.proscribeTargetId);
  S.pendingPower = null;
  if(S.winner){
    S.phase='gameover';
    render();
    return;
  }
  S.phase = 'decree_result';
  render();
}

/* ---------- After decree result: advance ---------- */
function afterDecreeContinue(){
  if(S.winner){ render(); return; }
  if(S.specialElectionActive){
    S.specialElectionActive = false;
    var idx = S.players.findIndex(function(p){return p.id===S.specialElectionPicked;});
    S.princepsIndex = idx;
    S.specialElectionPicked = null;
    beginNomination();
    return;
  }
  advancePrinceps();
  beginNomination();
}

/* ---------- Rendering ---------- */
// A filled track slot's small attribution note: who was Princeps and Consul
// when that particular card was enacted, so a glance at the track (not just
// the scrolling log) shows the combo behind each Decree. Just the initials
// fit in the card; the full names ride along as a hover/tap title. A card
// forced through by Chaos (three failed nominations in a row) had no real
// Princeps/Consul choice behind it, so it gets a plain "Chaos" note instead.
function trackNoteHtml(entry){
  if(!entry) return '';
  if(entry.isChaos) return '<div class="tnote">Chaos</div>';
  var title = 'Princeps '+entry.princepsName+' &amp; Consul '+entry.consulName;
  return '<div class="tnote" title="'+title.replace(/"/g,'&quot;')+'">'+initialsOf(entry.princepsName)+'&middot;'+initialsOf(entry.consulName)+'</div>';
}
function trackHtml(){
  var tier = powerTier(S.count);
  var powers = POWER_TABLE[tier];
  var rpHistory = S.enactmentHistory.filter(function(e){ return e.card==='RP'; });
  var imHistory = S.enactmentHistory.filter(function(e){ return e.card==='IM'; });
  var rpSlots='';
  for(var i=1;i<=5;i++){
    var filled = i<=S.rp;
    var isWinSlot = (i===5);
    var rcls = 'trackcard'+(filled?' filled rp':'')+(isWinSlot&&!filled?' win':'');
    var rinner;
    if(filled){
      rinner = '<div class="tlabel">Res<br>Publica</div>'+trackNoteHtml(rpHistory[i-1]);
    } else if(isWinSlot){
      rinner = '<div class="ticon">'+WIN_ICON.rp+'</div><div class="tlabel">Victory</div>';
    } else {
      rinner = '<div class="tlabel">'+i+'</div>';
    }
    rpSlots += '<div class="'+rcls+'">'+rinner+'</div>';
  }
  var imTotal = imWinThreshold();
  // In standard games (5-10 players), electing the Imperator as Consul is an
  // instant Conspiracy win once 3+ Imperium Decrees are enacted — mark the
  // slots from that point on so the danger is visible on the track itself.
  var imperatorDanger = !smallGame();
  var imSlots='';
  for(var i=1;i<=imTotal;i++){
    var filled = i<=S.im;
    var pw = powers[i];
    var isWinSlot = (i===imTotal);
    var isDanger = imperatorDanger && (i>=4);
    var cls = 'trackcard'+(filled?' filled im':'')+(pw?' power':'')+(isWinSlot&&!filled?' win':'')+(isDanger&&!filled?' danger':'');
    var inner;
    if(filled){
      inner = '<div class="tlabel">Imperium</div>'+trackNoteHtml(imHistory[i-1]);
    } else if(isWinSlot){
      inner = '<div class="ticon">'+WIN_ICON.im+'</div><div class="tlabel">Victory</div>'+(isDanger?'<div class="tdanger">Imperator wins</div>':'');
    } else if(pw){
      inner = '<div class="ticon">'+POWER_ICON[pw]+'</div><div class="tlabel">'+POWER_LABEL[pw]+'</div>'+(isDanger?'<div class="tdanger">Imperator wins</div>':'');
    } else {
      inner = '<div class="tlabel">'+i+'</div>'+(isDanger?'<div class="tdanger">Imperator wins</div>':'');
    }
    imSlots += '<div class="'+cls+'">'+inner+'</div>';
  }
  return '' +
  '<div class="trackwrap"><div class="eyebrow">Res Publica &middot; '+S.rp+'/5</div><div class="track">'+rpSlots+'</div></div>' +
  '<div class="trackwrap" style="margin-top:14px"><div class="eyebrow">Imperium &middot; '+S.im+'/'+imTotal+'</div><div class="track">'+imSlots+'</div></div>' +
  (imperatorDanger?'<div class="small" style="color:#8b1a1a">After 3 Imperium Decrees, electing the Imperator as Consul ends the game right away — the dark red slots mark that danger zone.</div>':'') +
  '<div class="trackwrap" style="margin-top:14px"><div class="eyebrow">The Decree Chest</div><div class="track">' +
    '<div class="trackcard deck"><div class="ticon">'+DECK_ICON+'</div><div class="tcount">'+S.discardPile.length+'</div><div class="tlabel">Discarded</div></div>' +
    '<div class="trackcard deck"><div class="ticon">'+DECK_ICON+'</div><div class="tcount">'+S.deck.length+'</div><div class="tlabel">Remaining</div></div>' +
  '</div></div>';
}

function publicNoticesHtml(){
  if(!S.publicNotices.length) return '';
  return '<div class="row notices">' +
    S.publicNotices.map(function(n){
      return '<span class="pill notice">'+POWER_ICON.investigate+'<span>'+n.text+'</span></span>';
    }).join('') +
  '</div>';
}

function seatsHtml(){
  if(!S.players.length) return '';
  var princepsId = currentPrinceps().id;
  var consulId = S.consulId;
  return '<div class="seats">' +
    S.players.map(function(p){
      var isPrinceps = p.id===princepsId;
      var isConsul = consulId!=null && p.id===consulId;
      var cls = 'seat' + (!p.alive?' dead':'') + (isPrinceps?' princeps':'') + (isConsul?' consul':'');
      var badges = '';
      if(isPrinceps) badges += '<span class="seatbadge princeps">Princeps</span>';
      if(isConsul) badges += '<span class="seatbadge consul">Consul</span>';
      return '<div class="'+cls+'">' +
        '<span class="seatname">'+avatarHtml(p,20)+' '+p.name+(p.isHuman?' <span class="seatyou">(you)</span>':'')+'</span>' +

// Shows the most recent dialogue line — whoever last spoke, said openly, in
// plain view of the table — right at the top of the screen, not buried down
// in the scrolling log. Covers the "Curia waits" spinner too (see render()),
// so it reads as spoken live while that player's turn is actually happening,
// not just as a record after the fact. Clears the moment the next player
// stays silent, so nothing stale lingers past its own turn.
function speechBubbleHtml(){
  if(!S.lastSpeech) return '';
  var speaker = byId(S.lastSpeech.playerId);
  return '<div class="speechBubble">' +
    (speaker ? avatarHtml(speaker,28) : '') +
    '<div class="speechBubbleBody"><span class="speechBubbleName">'+S.lastSpeech.name+'</span>' +
    '<span class="speechBubbleText">"'+S.lastSpeech.text+'"</span></div>' +
  '</div>';
}

// Small private notepad for the human player — "Wax Tablet". Freeform text,
// never read by bots, never shown to anyone else, not saved into the round
// recap or the log. Kept open/closed across re-renders via notesPanelOpen
// (a plain module var, not part of S — it's UI chrome, not game state).
var notesPanelOpen = false;
function notesHtml(){
  var val = (S.personalNotes||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return '<details class="card notesCard"'+(notesPanelOpen?' open':'')+'>' +
    '<summary>Wax Tablet <span class="small" style="font-weight:400">— your private notes</span></summary>' +
    '<textarea id="personalNotesArea" class="waxTablet" placeholder="Suspicions, votes to remember, anything you like. Only you see this.">'+val+'</textarea>' +
  '</details>';
}

function overlayWrap(inner){
  return '<div class="overlay"><div class="card">'+inner+'</div></div>';
}

function renderLog(full){
  if(!S.log.length) return '';
  var entries = full ? S.log : S.log.slice(0,12);
  return '<div class="card"><h3>Record of the Senate</h3><div class="log">'+
    entries.map(function(l){return '<div>— '+l+'</div>';}).join('') +
  '</div></div>';
}

// Mid-game intel access. Two separate panels, deliberately kept apart:
// "My confirmed intel" is the human's own private Investigate Loyalty
// results — theirs alone, same information a real player would just have
// to remember. "Investigations & Foresight so far" is the WHO, not the
// RESULT — who investigated or foresaw whom, over the whole game, not just
// the 3-round public-notice window — exactly what's legitimately public.
// Results stay private to whoever performed the power, same as in play.
function renderIntelPanel(){
  var h = humanPlayer();
  var allyHtml = '';
  if(h && h.role!=='senator'){
    // Only the players who were actually told their allies at the reveal
    // screen (conspiratorTeammates()) ever see this panel — a senator, or a
    // conspirator/Imperator in a game size where nobody is shown allies,
    // gets nothing here, exactly mirroring what renderReveal() showed them.
    var mates = conspiratorTeammates(h);
    if(mates.length){
      allyHtml = '<details class="card" open><summary>Your fellow conspirators</summary>' +
        mates.map(function(t){return '<div class="playerchip">'+avatarHtml(t,20)+' '+t.name+(t.role==='imperator'?' <span class="badge-consul">IMPERATOR</span>':'')+'</div>';}).join('') +
      '</details>';
    }
  }
  var mineHtml = '';
  if(h){
    var entries = Object.keys(h.intel).map(function(id){
      var t = byId(parseInt(id,10));
      if(!t) return null;
      return '<div>&mdash; '+t.name+': <strong>'+(h.intel[id]==='loyal'?'Loyal to the Republic':'Enemy of the Republic')+'</strong></div>';
    }).filter(function(x){ return x; });
    mineHtml = '<details class="card"><summary>My confirmed intel'+(entries.length?' ('+entries.length+')':'')+'</summary>' +
      (entries.length ? entries.join('') : '<div>You haven\'t found out anyone\'s true side yet.</div>') +
    '</details>';
  }
  var historyHtml = '';
  if(S.investigateLog.length || S.peekLog.length){
    var invRows = S.investigateLog.map(function(e){ return '<div>&mdash; '+e.investigatorName+' investigated '+e.targetName+' (only they know the result)</div>'; }).join('');
    var peekRows = S.peekLog.map(function(e){ return '<div>&mdash; '+e.name+' peeked at the next cards (only they know what they saw)</div>'; }).join('');
    historyHtml = '<details class="card"><summary>Investigations &amp; Foresight so far</summary>' + invRows + peekRows + '</details>';
  }
  return allyHtml + mineHtml + historyHtml + aiPrimerHtml();
}

function render(){
  var app = document.getElementById('app');
  var html = '';

  if(S.phase==='setup'){
    html = renderSetup();
  } else if(S.phase==='reveal'){
    html = renderReveal();
  } else {
    // The log (where every spoken dialogue line lands) now stays visible
    // even on the "Curia waits" spinner screen, so a line someone just
    // spoke is still "heard" by the table while the next player thinks —
    // it no longer vanishes the instant the spinner comes up. The private
    // intel panel stays hidden during bot_wait; nothing new to show there
    // mid-turn, and it's a lot of extra chrome under a moment meant to feel
    // like a brief pause, not a full screen.
    html = statusBarHtml() + speechBubbleHtml() + notesHtml() + renderPhase() + (S.phase==='gameover' ? '' : (S.phase==='bot_wait' ? renderLog() : (renderIntelPanel() + renderLog())));
  }
  // The notes textarea can be re-rendered out from under the player mid-
  // keystroke (a bot-turn timer calls render() independently of typing), so
  // capture focus + cursor position beforehand and restore it after the
  // innerHTML rebuild — otherwise a full rebuild silently steals focus and
  // resets the cursor to the start even though S.personalNotes stays correct.
  var notesFocused = (document.activeElement && document.activeElement.id==='personalNotesArea');
  var notesSelStart = notesFocused ? document.activeElement.selectionStart : null;
  var notesSelEnd = notesFocused ? document.activeElement.selectionEnd : null;
  app.innerHTML = html;
  if(notesFocused){
    var restoredNotes = document.getElementById('personalNotesArea');
    if(restoredNotes){
      restoredNotes.focus();
      try{ restoredNotes.setSelectionRange(notesSelStart, notesSelEnd); }catch(e){}
    }
  }
  wireEvents();
  clearAutoContinue();
  if(S.speed!=='off'){
    var autoFn = autoContinueHandler();
    if(autoFn) autoContinueTimer = setTimeout(function(){ autoContinueTimer=null; autoFn(); }, speedDelay());
  }
  try{
    if(window.claude && window.claude.hot && window.claude.hot.snapshot){
      window.claude.hot.snapshot(S);
    }
  }catch(e){}
}

// The last 3 completed games, saved to this browser only (localStorage) —
// never sent anywhere, never shared with anyone else who opens this page.
// Each is copyable as plain text so it can be pasted elsewhere for review.
function pastGamesHtml(){
  var history = loadGameHistory();
  if(!history.length) return '';
  return '<div class="card">' +
    '<h2>Past games ('+history.length+')</h2>' +
    '<p class="small">Saved on this device only — your last '+GAME_HISTORY_MAX+' finished games.</p>' +
    '<div class="stack">' +
      history.map(function(record, i){
        var when = new Date(record.timestamp).toLocaleString();
        var winnerLabel = record.winner==='senate' ? 'Senate won' : 'Conspirators won';
        return '<details><summary>'+when+' &mdash; '+record.count+'p &mdash; '+winnerLabel+'</summary>' +
          '<div>'+record.winReason+'</div>' +
          '<div class="stack" style="margin-top:8px">' +
            record.players.map(function(p){ return '<div>&mdash; '+p.name+(p.isHuman?' (you)':'')+': '+roleLabel(p.role)+'</div>'; }).join('') +
          '</div>' +
          '<button class="ghost full" data-copy-history="'+i+'" style="margin-top:10px">Copy full record</button>' +
        '</details>';
      }).join('') +

}

// Accessible from setup (and, once a game is underway, the Curia Record
// panel via renderIntelPanel). Explains bot behavior that would otherwise
// look like inconsistency or randomness — sleeper cover play, strategic
// proscribing, and late-game obstruction — as documented strategy rather
// than the AI "forgetting" to act in character.
function aiPrimerHtml(){
  return '<div class="card">' +
    '<h3>How your opponents play</h3>' +
    '<p class="small">Bots only use fair information — public votes and enacted cards, never hidden roles. Most play their side in a straightforward way, but a few hide their true colors for a while, and everyone reads voting patterns as evidence.</p>' +
    '<details><summary>Read the full breakdown</summary>' +
      '<div>Your fellow senators, and any Conspirators or the Imperator, are bots. They never cheat by peeking at hidden roles — everything they do comes from what a real player could fairly work out: public votes, who enacted what, and their own private Investigate Loyalty results.</div>' +
      '<div><strong>Most Conspirators play it straight</strong> — pushing Imperium Decrees and backing their own side\'s votes whenever they hold power. But not all of them, and not always:</div>' +
      '<div>&mdash; Some Conspirators (especially the Imperator, who has the most to gain from staying hidden) start the game as a <strong>"sleeper"</strong> — a few who play it safe and act like a loyal Senator for a while, to avoid suspicion. They\'ll drop the act once things get dangerous, once an Investigate confirms them, or eventually just by chance.</div>' +
      '<div>&mdash; Late in a close game, some Conspirators will <strong>vote Nay on a government that looks trustworthy</strong> instead of automatically backing it — denying the Senate an easy Res Publica Decree. This only happens sometimes, not by default, so an odd vote from a normally reliable player is itself a real clue.</div>' +
      '<div>&mdash; When proscribing, Conspirators go after anyone who they know has already confirmed their identity, then any confirmed enemy, and otherwise target whoever currently looks MOST trustworthy — that\'s their best guess at a real, reliable Senate figure. The Senate\'s own proscribe logic works the same way in reverse: confirmed enemies first, then whoever looks most suspicious.</div>' +
      '<div>&mdash; The Senate gets more cautious with its votes once things turn dangerous, and it also watches voting patterns the same way: an Aye on a risky-looking pair, or a Nay on a safe-looking one, quietly changes how trustworthy that voter looks from then on.</div>' +
    '</details>' +
  '</div>';
}

function renderReveal(){
  var p = humanPlayer();
  if(!S.revealShown){
    return overlayWrap(
      '<div class="eyebrow">Role assignment</div>' +
      '<h2>The lots have been cast</h2>' +
      '<p class="small">This screen is just for you — your bot opponents don\'t need one.</p>' +
      '<button class="primary full" id="showRoleBtn">Reveal my role</button>'
    );
  }
  var desc = '';
  if(p.role==='senator'){
    desc = 'You\'re on the Senate\'s side. Play Res Publica Decrees and try to find the hidden Conspirators before it\'s too late.';
  } else if(p.role==='conspirator'){
    desc = 'You\'re a Conspirator. Push Imperium Decrees, protect your Imperator, and try to get them elected Consul once things are bad enough for the Senate.';
  } else {
    desc = 'You\'re the Imperator — the Conspiracy\'s secret leader. If you get elected Consul after three Imperium Decrees, you win instantly. Stay under the radar.';
  }
  var teammates = conspiratorTeammates(p);
  var teamHtml = '';
  if(p.role!=='senator'){
    if(teammates.length){
      teamHtml = '<div class="stack"><div class="eyebrow">Your fellow conspirators</div>' +
        teammates.map(function(t){return '<div class="playerchip">'+t.name+(t.role==='imperator'?' <span class="badge-consul">IMPERATOR</span>':'')+'</div>';}).join('') +
      '</div>';
    } else {
      teamHtml = '<p class="small">You don\'t know who your fellow Conspirators are. Don\'t trust anyone, don\'t give yourself away — and be careful who you proscribe.</p>';
    }
  } else if(smallGame()){
    teamHtml = '<p class="small">You don\'t know which other players are Senators like you. Be careful who you proscribe.</p>';
  }
  return overlayWrap(
    '<div class="eyebrow">Your role</div>' +
    '<div class="role-badge '+roleClass(p.role)+'">'+roleLabel(p.role)+'</div>' +
    '<p>'+desc+'</p>' +
    teamHtml +
    '<button class="primary full" id="hideRoleBtn">Enter the Curia</button>'
  );
}

function renderVote(){

  var riskWarning = (!smallGame() && S.im>=3) ? '<p class="small warn">This is risky now: if '+nominee.name+' is secretly the Imperator, voting them in as Consul ends the game right away for the Conspiracy — keep that in mind.</p>' : '';

        }
        return (activeTutorialTip()==='vote' ? tutorialCalloutHtml('vote') : '') +
          '<div class="voterow"><span>'+avatarHtml(p,20)+' '+p.name+' (you)</span>' +
          '<div class="togglepair">' +
            '<button class="'+(v===true?'chosen-aye':'')+'" data-vote-id="'+p.id+'" data-vote-val="1">Aye</button>' +
            '<button class="'+(v===false?'chosen-nay':'')+'" data-vote-id="'+p.id+'" data-vote-val="0">Nay</button>' +
          '</div></div>';
      }).join('') +
    '</div>' +
    ((function(){
      var h = humanPlayer();
      if(!h || !h.alive || S.votes[h.id]!==undefined) return '';
      return '<select id="claimSelect-vote" class="select">' +
        '<option value="">Stay silent</option>' +
        '<optgroup label="If Aye">' +
          '<option value="ay_trust">I trust this pairing. Aye.</option>' +

// The detailed, chronological (oldest-first) blow-by-blow — every
// nomination, vote, decree (with who enacted it), veto, investigation and
// proscription, in the order they happened. Collapsed by default so the
// game-over screen isn't dominated by it; opt in with the dropdown.
function fullRecapHtml(){
  if(!S.log.length) return '';
  var chronological = S.log.slice().reverse();
  return '<details class="card"><summary>Full round-by-round recap ('+chronological.length+' events)</summary>' +
    '<div class="log">' + chronological.map(function(l,i){return '<div>'+(i+1)+'. '+l+'</div>';}).join('') + '</div>' +
  '</details>';
}

// Each living player's own final, private suspicion reading of everyone
// else — real numbers, not a reconstruction. Only shown here, after the
// game (and the full role reveal) is already over. The human's own card is
// always included (even if they were proscribed — see buildGameRecord) and
// opened by default, since it's specifically theirs and easy to otherwise
// miss among a full table of bot readings.
function renderSuspicionHtml(suspicion){
  if(!suspicion || !suspicion.length) return '';
  return '<div class="card"><h3>Final trust readings</h3>' +
    '<p class="small">A private score (0-100) for how suspicious each surviving player thought everyone else looked, right when the game ended — higher means "looked more like a Conspirator." Nobody could see this during the game.</p>' +
    '<div class="stack">' +
      suspicion.map(function(observer){
        return '<details'+(observer.isHuman?' open':'')+'><summary>As seen by '+observer.name+(observer.isHuman?' (you)':'')+(observer.alive?'':' (removed)')+'</summary>' +
          observer.readings.slice().sort(function(a,b){ return b.score-a.score; }).map(function(r){
            var row = '<div>&mdash; '+r.name+(r.alive?'':' (removed)')+': <strong>'+r.score+'</strong>'+(r.confirmed?' ('+r.confirmed+')':'')+'</div>';
            if(observer.isHuman) row += trustExplainHtml(r.name);
            return row;
          }).join('') +
        '</details>';
      }).join('') +
    '</div>' +
  '</div>';
}

// Only for the human's own trust readings: a small, dismissible-by-default
// breakdown of the fair, public evidence available on this one player —
// what a careful player could legitimately have noticed, reconstructed
// from the actual game record (never from hidden roles). Purely
// explanatory — it changes nothing about the score itself.
function trustExplainHtml(targetName){
  var target = S.players.filter(function(p){ return p.name===targetName; })[0];
  if(!target) return '';
  var lines = [];
  var entries = S.enactmentHistory || [];
  var asConsul = entries.filter(function(e){ return !e.isChaos && e.consulName===target.name; });
  var asPrinceps = entries.filter(function(e){ return !e.isChaos && e.princepsName===target.name; });
  if(asConsul.length){
    var imC = asConsul.filter(function(e){return e.card==='IM';}).length;
    var rpC = asConsul.filter(function(e){return e.card==='RP';}).length;
    lines.push('Served as Consul '+asConsul.length+' time'+(asConsul.length===1?'':'s')+' — enacted '+imC+' Imperium and '+rpC+' Res Publica decree'+((imC+rpC)===1?'':'s')+'.');
  }
  if(asPrinceps.length){
    var imP = asPrinceps.filter(function(e){return e.card==='IM';}).length;
    var rpP = asPrinceps.filter(function(e){return e.card==='RP';}).length;
    lines.push('Served as Princeps '+asPrinceps.length+' time'+(asPrinceps.length===1?'':'s')+' — the Consul enacted '+imP+' Imperium and '+rpP+' Res Publica decree'+((imP+rpP)===1?'':'s')+' from what they were handed.');
  }
  var investigatedBy = (S.investigateLog||[]).filter(function(e){return e.targetName===target.name;}).map(function(e){return e.investigatorName;});
  if(investigatedBy.length) lines.push('Investigated by: '+investigatedBy.join(', ')+' — their private result, unless it was yours (see "My confirmed intel" during play).');
  var nayFrom = (target.nayVotesReceived||[]).map(function(id){ var v=byId(id); return v?v.name:null; }).filter(function(x){return x;});
  if(nayFrom.length) lines.push('Received a Nay vote, at some point, from: '+nayFrom.join(', ')+' — a public fact anyone could have weighed.');
  if(!target.alive){
    var plines = (S.log||[]).filter(function(l){ return l.indexOf('proscribes '+target.name+'.')!==-1; });
    lines.push(plines.length ? plines[0] : (target.name+' was removed from the game before it ended.'));
  }
  if(!lines.length) lines.push('Nothing stood out about them publicly — this score mostly reflects voting patterns and instinct, which won\'t always leave a clean paper trail.');
  return '<details style="margin:2px 0 8px 14px"><summary class="small">What this is based on</summary>' +
    '<div class="small" style="margin-top:4px">' + lines.map(function(l){return '<div>&mdash; '+l+'</div>';}).join('') + '</div>' +
  '</details>';
}

/* ---------- Events ---------- */
function wireEvents(){
  var app = document.getElementById('app');

  var humanNameInput = document.getElementById('humanNameInput');
  if(humanNameInput) humanNameInput.oninput = function(){ S.humanName = this.value; };

  var personalNotesArea = document.getElementById('personalNotesArea');
  if(personalNotesArea) personalNotesArea.oninput = function(){ S.personalNotes = this.value; };
  var notesCard = app.querySelector('.notesCard');
  if(notesCard) notesCard.ontoggle = function(){ notesPanelOpen = this.open; };

  app.querySelectorAll('[data-tutorial-dismiss]').forEach(function(b){
    b.onclick = function(){ S.tutorialSeen[this.getAttribute('data-tutorial-dismiss')] = true; render(); };
  });
  var tutorialBtn = document.getElementById('tutorialBtn');
  if(tutorialBtn) tutorialBtn.onclick = function(){
    // Smallest, plainest possible table: you + 1 bot Senator + 1 bot
    // Conspirator. No Imperator to explain yet, and (see beginReveal /
    // p.sleeper) bots play their own side straight — no sleepers, no
    // false "I had no choice" claims — so the one thing a new player is
    // learning (reading a straightforward Conspirator) stays legible.
    S.count = 3; S.includeImperator = false; S.difficulty = 'medium'; S.speed = 'off';
    S.tutorialMode = true; S.tutorialSeen = {};
    beginReveal();
  };

  app.querySelectorAll('[data-count]').forEach(function(b){
    b.onclick = function(){ S.count = parseInt(this.getAttribute('data-count'),10); render(); };
  });
  app.querySelectorAll('[data-imperator]').forEach(function(b){
    b.onclick = function(){ S.includeImperator = this.getAttribute('data-imperator')==='1'; render(); };
  });
  app.querySelectorAll('[data-speed]').forEach(function(b){
    b.onclick = function(){ S.speed = this.getAttribute('data-speed'); render(); };
  });
  app.querySelectorAll('[data-difficulty]').forEach(function(b){
    b.onclick = function(){ S.difficulty = this.getAttribute('data-difficulty'); render(); };
  });
  app.querySelectorAll('[data-copy-history]').forEach(function(b){
    b.onclick = function(){
      var idx = parseInt(this.getAttribute('data-copy-history'),10);
      var history = loadGameHistory();
      var record = history[idx];
      if(record) copyTextToClipboard(formatGameRecordText(record), this);
    };
  });
  var copyThisGameBtn = document.getElementById('copyThisGameBtn');
  if(copyThisGameBtn) copyThisGameBtn.onclick = function(){ copyTextToClipboard(formatGameRecordText(buildGameRecord()), this); };
  var beginBtn = document.getElementById('beginBtn');
  if(beginBtn) beginBtn.onclick = beginReveal;

  var showRoleBtn = document.getElementById('showRoleBtn');
  if(showRoleBtn) showRoleBtn.onclick = function(){ S.revealShown = true; render(); };
  var hideRoleBtn = document.getElementById('hideRoleBtn');
  if(hideRoleBtn) hideRoleBtn.onclick = function(){ beginNomination(); };

  app.querySelectorAll('[data-nominee]').forEach(function(b){
    b.onclick = function(){ S.nomineeId = parseInt(this.getAttribute('data-nominee'),10); render(); };
  });
  var confirmNomBtn = document.getElementById('confirmNomBtn');
  if(confirmNomBtn) confirmNomBtn.onclick = function(){
    var sel = document.getElementById('claimSelect-nominate');
    var claimId = sel && sel.value ? sel.value : null;
    botSpeak(currentPrinceps(), 'nominate', claimId, byId(S.nomineeId) ? byId(S.nomineeId).name : null);
    confirmNomination();
  };

  app.querySelectorAll('[data-vote-id]').forEach(function(b){
    b.onclick = function(){
      var sel = document.getElementById('claimSelect-vote');
      var claimId = sel && sel.value ? sel.value : null;
      castVote(parseInt(this.getAttribute('data-vote-id'),10), this.getAttribute('data-vote-val')==='1', claimId);
    };
  });
  app.querySelectorAll('[data-top-vote-val]').forEach(function(b){
    b.onclick = function(){
      var hp = humanPlayer();
      if(hp) castVote(hp.id, this.getAttribute('data-top-vote-val')==='1');
    };
  });
  var voteContinueBtn = document.getElementById('voteContinueBtn');
  if(voteContinueBtn) voteContinueBtn.onclick = function(){ fireContinue(afterVoteResultContinue); };
  var chaosContinueBtn = document.getElementById('chaosContinueBtn');
  if(chaosContinueBtn) chaosContinueBtn.onclick = function(){ fireContinue(afterChaosContinue); };

  app.querySelectorAll('[data-discard-toggle]').forEach(function(b){
    b.onclick = function(){
      var idx = parseInt(this.getAttribute('data-discard-toggle'),10);
      var at = S.discardSelection.indexOf(idx);
      if(at!==-1){
        S.discardSelection.splice(at,1);
      } else if(S.discardSelection.length<2){
        S.discardSelection.push(idx);
      }
      render();
    };
  });
  var confirmDiscardBtn = document.getElementById('confirmDiscardBtn');
  if(confirmDiscardBtn) confirmDiscardBtn.onclick = function(){
    if(S.discardSelection.length!==2) return;
    // The one card NOT picked to hand forward is the one discarded.
    var discardIdx = [0,1,2].filter(function(i){ return S.discardSelection.indexOf(i)===-1; })[0];
    var sel = document.getElementById('claimSelect-discard');
    var claimId = sel && sel.value ? sel.value : null;
    princepsDiscard(discardIdx, claimId);
  };

  app.querySelectorAll('[data-enact-toggle]').forEach(function(b){
    b.onclick = function(){
      var idx = parseInt(this.getAttribute('data-enact-toggle'),10);
      S.enactSelection = (S.enactSelection===idx) ? null : idx;
      render();
    };
  });
  var confirmEnactBtn = document.getElementById('confirmEnactBtn');
  if(confirmEnactBtn) confirmEnactBtn.onclick = function(){
    if(S.enactSelection==null) return;
    var sel = document.getElementById('claimSelect-enact');
    var claimId = sel && sel.value ? sel.value : null;
    consulEnact(S.enactSelection, claimId);
  };
  var requestVetoBtn = document.getElementById('requestVetoBtn');
  if(requestVetoBtn) requestVetoBtn.onclick = function(){
    var sel = document.getElementById('claimSelect-vetoPropose');
    var claimId = sel && sel.value ? sel.value : null;
    consulRequestVeto(claimId);
  };

  var vetoYes = document.getElementById('vetoYes');
  if(vetoYes) vetoYes.onclick = function(){
    var sel = document.getElementById('claimSelect-vetoDecide');
    var claimId = sel && sel.value ? sel.value : null;
    princepsAcceptVeto(true, claimId);
  };
  var vetoNo = document.getElementById('vetoNo');
  if(vetoNo) vetoNo.onclick = function(){
    var sel = document.getElementById('claimSelect-vetoDecide');
    var claimId = sel && sel.value ? sel.value : null;
    princepsAcceptVeto(false, claimId);
  };

  var decreeContinueBtn = document.getElementById('decreeContinueBtn');
  if(decreeContinueBtn) decreeContinueBtn.onclick = function(){ fireContinue(afterDecreeContinue); };

  var powerBeginBtn = document.getElementById('powerBeginBtn');
  if(powerBeginBtn) powerBeginBtn.onclick = function(){ fireContinue(beginPower); };

  app.querySelectorAll('[data-investigate]').forEach(function(b){
    b.onclick = function(){ investigatePick(parseInt(this.getAttribute('data-investigate'),10)); };
  });
  var investigateDoneBtn = document.getElementById('investigateDoneBtn');
  if(investigateDoneBtn) investigateDoneBtn.onclick = function(){
    var sel = document.getElementById('claimSelect-investigate');
    var claimId = sel && sel.value ? sel.value : null;
    fireContinue(function(){ finishInvestigate(claimId); });
  };

  app.querySelectorAll('[data-special]').forEach(function(b){
    b.onclick = function(){
      var sel = document.getElementById('claimSelect-special');
      var claimId = sel && sel.value ? sel.value : null;
      specialElectionPick(parseInt(this.getAttribute('data-special'),10), claimId);
    };
  });

  var peekDoneBtn = document.getElementById('peekDoneBtn');
  if(peekDoneBtn) peekDoneBtn.onclick = function(){ fireContinue(finishPeek); };

  app.querySelectorAll('[data-proscribe]').forEach(function(b){
    b.onclick = function(){
      var sel = document.getElementById('claimSelect-proscribe');
      var claimId = sel && sel.value ? sel.value : null;
      // Non-preventive secondary step: don't proscribe yet, just ask once.
      S.proscribeConfirmId = parseInt(this.getAttribute('data-proscribe'),10);
      S.proscribePendingClaim = claimId;
      render();
    };
  });
  var confirmProscribeBtn = document.getElementById('confirmProscribeBtn');
  if(confirmProscribeBtn) confirmProscribeBtn.onclick = function(){
    var id = S.proscribeConfirmId, claimId = S.proscribePendingClaim;
    S.proscribeConfirmId = null; S.proscribePendingClaim = null;
    proscribePick(id, claimId);
  };
  var cancelProscribeBtn = document.getElementById('cancelProscribeBtn');
  if(cancelProscribeBtn) cancelProscribeBtn.onclick = function(){
    S.proscribeConfirmId = null; S.proscribePendingClaim = null;
    render();
  };
  var skipProscribeBtn = document.getElementById('skipProscribeBtn');
  if(skipProscribeBtn) skipProscribeBtn.onclick = function(){
    var sel = document.getElementById('claimSelect-proscribeSkip');
    var claimId = sel && sel.value ? sel.value : null;
    skipProscribe(claimId);
  };
  var proscribeContinueBtn = document.getElementById('proscribeContinueBtn');
  if(proscribeContinueBtn) proscribeContinueBtn.onclick = function(){ fireContinue(finishProscribe); };
  var toGameOverBtn = document.getElementById('toGameOverBtn');
  if(toGameOverBtn) toGameOverBtn.onclick = function(){ fireContinue(goToGameOver); };

  var newGameBtn = document.getElementById('newGameBtn');
  if(newGameBtn) newGameBtn.onclick = function(){
    var count = S.count;
    var humanName = S.humanName;
    var includeImperator = S.includeImperator;
    var speed = S.speed;
    var difficulty = S.difficulty;
    S = {
      phase:'setup', count:count, includeImperator:includeImperator, humanName:humanName, speed:speed, difficulty:difficulty, historySaved:false, players:[], revealShown:false,
      princepsIndex:0, consulId:null, nomineeId:null, previousConsulId:null, previousPrincepsId:null,
      votes:{}, electionTracker:0, rp:0, im:0, deck:[], discardPile:[], drawnThree:[],
      handedTwo:[], vetoRequested:false, pendingPower:null,
      investigateTargetId:null, investigateResult:null, specialElectionPicked:null, specialElectionActive:false,
      proscribeTargetId:null, peekCards:[], thinkingLabel:'', lastSpeech:null, log:[], winner:null, winReason:'', betrayal:null,
      investigateLog:[], peekLog:[], publicNotices:[], investigateVouches:{}, enactmentHistory:[],
      personalNotes:'', tutorialMode:false, tutorialStep:0, tutorialSeen:{},
      proscribeConfirmId:null, proscribePendingClaim:null,
      discardSelection:[], enactSelection:null
    };
    startSetup();
  };
}

/* ---------- Boot ---------- */
function start(initial){
  if(initial && initial.phase){
    S = initial;
  } else {
    startSetup();
    return;
  }
  render();
}

try{
  if(window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(start);
  } else {
    start(window.claude && window.claude.hot ? window.claude.hot.data : null);
  }
}catch(e){
  startSetup();
}
})();
</script>

</body></html>
